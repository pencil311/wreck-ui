<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Jumping</title>
    <meta name="description" content="Immersive space portal experience featuring 3D canvas portal tilt, cinematic planetary travel, and video preloader sequence." />
    <meta property="og:title" content="Planet Jumping" />
    <meta property="og:description" content="Immersive space portal experience featuring 3D canvas portal tilt, cinematic planetary travel, and video preloader sequence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      @font-face {
        font-family: 'SF Pro';
        src: local('SF Pro Text'), local('SF Pro'), local('SFProText-Regular'), local('Helvetica Neue'), local('Arial');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'SF Pro';
        src: local('SF Pro Text Bold'), local('SF Pro Bold'), local('SFProText-Bold'), local('Helvetica Neue Bold'), local('Arial Bold');
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: 'SF Pro Thin';
        src: local('SF Pro Display Thin'), local('SF Pro Thin'), local('SFProDisplay-Thin');
        font-weight: 100;
        font-style: normal;
      }
      @font-face {
        font-family: 'Aalto';
        src: local('Aalto'), local('Archivo Narrow'), local('Roboto Condensed'), local('Oswald'), local('Haettenschweiler'), local('Franklin Gothic Medium Cond'), local('Arial Narrow');
        font-weight: 400;
        font-style: normal;
      }

      /* Dark is the base; light overrides below. Text splits in two:
         --glass-ink sits on a controlled glass surface and flips with the theme,
         while --ink floats directly on photography and stays light in both
         themes so it survives the dark space backgrounds too. */
      :root {
        font-family: 'SF Pro', Arial, sans-serif;
        font-synthesis: none;
        --accent: #FF4A0F;
        --ink: #fff;
        --ink-shadow: 0 1px 14px rgba(0, 0, 0, .55);
        --ink-dim: rgba(255, 255, 255, .7);
        --glass-bg: rgba(255, 255, 255, .1);
        --glass-border: rgba(255, 255, 255, .45);
        --glass-ink: #fff;
        --solid-bg: #fff;
        --solid-ink: #000;
        --page-bg: #090807;
        --card-bg: rgba(4, 24, 32, .55);
        --card-border: rgba(255, 255, 255, .08);
        --card-ink: #fff;
        --card-dim: rgba(255, 255, 255, .6);
        --card-rule: rgba(255, 255, 255, .1);
        --seg-bg: rgba(255, 255, 255, .05);
        --seg-border: rgba(255, 255, 255, .12);
        --bar-track: rgba(255, 255, 255, .8);
        --highlight: rgba(255, 255, 255, .16);
        color: var(--ink);
        background: var(--page-bg);
      }
      :root[data-theme="light"] {
        /* the day photo is bright, so floating text needs a harder shadow */
        --ink-shadow: 0 1px 10px rgba(0, 0, 0, .85), 0 0 2px rgba(0, 0, 0, .6);
        --ink-dim: rgba(255, 255, 255, .88);
        --glass-bg: rgba(255, 255, 255, .55);
        --glass-border: rgba(20, 17, 14, .22);
        --glass-ink: #14110E;
        --solid-bg: #14110E;
        --solid-ink: #fff;
        --page-bg: #dfe6ef;
        --card-bg: rgba(255, 255, 255, .35);
        --card-border: rgba(255, 255, 255, .6);
        --card-ink: #14110E;
        --card-dim: rgba(20, 17, 14, .62);
        --card-rule: rgba(20, 17, 14, .12);
        --seg-bg: rgba(20, 17, 14, .06);
        --seg-border: rgba(20, 17, 14, .16);
        --bar-track: rgba(20, 17, 14, .45);
        --highlight: rgba(255, 255, 255, .5);
      }

      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html, body, button, a, .portal {
        cursor: none !important;
      }

      .experience {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 540px;
        overflow: hidden;
        background: #0a0908;
      }
      .backgrounds, .background, .shade, .transition-layer, .transition-layer video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .background {
        object-fit: cover;
        opacity: 0;
        transition: opacity .8s ease;
      }
      .background.is-visible {
        opacity: 1;
      }
      .shade {
        z-index: 1;
        background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, .88) 100%);
        pointer-events: none;
      }
      .chrome {
        position: absolute;
        z-index: 4;
        transition: opacity .45s ease, filter .45s ease;
      }
      .experience.is-transitioning .chrome {
        opacity: 0;
        filter: blur(8px);
        pointer-events: none;
      }

      /* HEADER */
      .header {
        left: clamp(18px, 1.95vw, 28px);
        right: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav {
        display: flex;
        align-items: center;
        height: 42px;
        padding: 4px 5px;
        border: 1px solid var(--glass-border);
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 999px;
      }
      .nav a {
        color: var(--glass-ink);
        text-decoration: none;
        padding: 8px 19px;
        border-radius: 999px;
        line-height: 1;
      }
      .nav a.active {
        background: var(--solid-bg);
        color: var(--solid-ink);
      }
      .menu {
        height: 42px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: var(--solid-bg);
        color: var(--solid-ink);
        cursor: pointer;
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
      }

      .theme-toggle {
        position: relative;
        width: 76px;
        height: 42px;
        padding: 0;
        border: 1px solid var(--glass-border);
        border-radius: 999px;
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        font-family: inherit;
      }
      .theme-knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--accent);
        transition: transform .45s cubic-bezier(.22, 1, .36, 1);
      }
      :root[data-theme="dark"] .theme-knob {
        transform: translateX(34px);
      }
      .theme-icons {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: space-around;
      }
      .theme-icon {
        position: relative;
        width: 18px;
        height: 18px;
        color: var(--glass-ink);
        opacity: .55;
        transition: color .3s ease, opacity .3s ease;
      }
      :root[data-theme="light"] .theme-sun,
      :root[data-theme="dark"] .theme-moon {
        color: #fff;
        opacity: 1;
      }

      /* HOME BACKGROUND (day/night pair in one slot) */
      .home-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity .9s ease;
      }
      :root[data-theme="light"] .home-bg-day,
      :root[data-theme="dark"] .home-bg-night {
        opacity: 1;
      }

      .home-layer {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      /* the grass band, feathered so the overlay has no visible seam */
      .home-grass {
        top: 62%;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 24%, #000 100%);
        mask-image: linear-gradient(to bottom, transparent 0%, #000 24%, #000 100%);
      }
      /* full resolution now that nothing is filtering it */
      .home-grass-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 100%;
        will-change: transform;
        animation: grass-idle 6.5s ease-in-out infinite;
      }
      /* the band shows the bottom 38% of the same cover-fitted frame */
      .home-grass .home-bg {
        top: auto;
        bottom: 0;
        height: 263.16%;
      }
      /* Idle sway only: a compositor-only transform that never reacts to the
         cursor. The cursor drives parallax on the layer above, nothing else. */
      @keyframes grass-idle {
        0%, 100% { transform: translate3d(0, 0, 0) skewX(0deg); }
        50%      { transform: translate3d(5px, 0, 0) skewX(.55deg); }
      }
      /* cloud drift: the base is scaled slightly so it has slack to move within */
      :root[data-theme="light"] .home-base .home-bg {
        animation: sky-drift 40s ease-in-out infinite;
      }
      @keyframes sky-drift {
        0%, 100% { transform: scale(1.02) translate3d(-4px, 0, 0); }
        50%      { transform: scale(1.02) translate3d(4px, 0, 0); }
      }

      /* Circular theme reveal; the clip-path itself is animated in JS from the
         toggle's position. Without these the browser cross-fades instead. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }
      ::view-transition-old(root) { z-index: 0; }
      ::view-transition-new(root) { z-index: 1; }

      /* SECTION PANELS (Home, Train, ... one per section, only one visible) */
      .section-panel {
        right: clamp(18px, 1.95vw, 28px);
        top: calc(clamp(18px, 3.1vh, 28px) + 58px);
        bottom: clamp(18px, 3vh, 28px);
        width: min(640px, 46vw);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
      .section-panel { display: none; }
      .section-panel.is-active { display: block; }
      .panel-head {
        margin-bottom: 14px;
      }
      .panel-eyebrow {
        font-size: 11px;
        letter-spacing: .17em;
        text-transform: uppercase;
        color: var(--ink);
        opacity: .75;
        text-shadow: var(--ink-shadow);
      }
      .panel-name {
        margin: 6px 0 0;
        font-family: Aalto, 'Arial Narrow', sans-serif;
        font-size: clamp(30px, 3.1vw, 44px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: .01em;
        text-transform: uppercase;
        color: var(--ink);
        text-shadow: var(--ink-shadow);
      }
      .panel-name .dot { color: var(--accent); }

      .panel-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding-bottom: 4px;
      }
      .card {
        position: relative;
        padding: 16px 18px 18px;
        border-radius: 4px;
        border: 1px solid var(--card-border);
        background: var(--card-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: var(--card-ink);
        overflow: hidden;
        will-change: transform;
      }
      .card.is-wide { grid-column: 1 / -1; }
      /* highlight tracks the pointer through --mx / --my */
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity .35s ease;
        background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), var(--highlight), transparent 62%);
      }
      .card.is-lit::after { opacity: 1; }

      .card-label {
        font-size: 10.5px;
        letter-spacing: .17em;
        text-transform: uppercase;
        color: var(--card-dim);
      }
      .card-big {
        margin: 10px 0 0;
        font-family: Aalto, 'Arial Narrow', sans-serif;
        font-size: 38px;
        font-weight: 400;
        line-height: .96;
        text-transform: uppercase;
      }
      .card-big.is-small { font-size: 27px; }
      .card-note { margin-top: 10px; font-size: 14px; }
      .card-sub { margin-top: 6px; font-size: 13px; color: var(--card-dim); }
      .card-icon {
        position: absolute;
        top: 16px;
        right: 18px;
        width: 22px;
        height: 22px;
        color: var(--accent);
      }

      .stat-row { display: flex; align-items: baseline; gap: 9px; margin-top: 10px; }
      .stat-num {
        font-family: Aalto, 'Arial Narrow', sans-serif;
        font-size: 46px;
        line-height: .9;
      }
      .stat-of { font-size: 13px; color: var(--card-dim); }

      .bar {
        margin-top: 14px;
        height: 3px;
        border-radius: 2px;
        background: var(--bar-track);
        overflow: hidden;
      }
      .bar.is-green { background: #6FBF8B; }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 1.1s cubic-bezier(.16, 1, .3, 1);
      }

      .btn-accent {
        margin-top: 16px;
        padding: 11px 16px;
        border: 0;
        border-radius: 3px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .btn-accent.is-full { width: 100%; }
      .btn-accent.is-done { background: #2E7D4F; }
      .link-accent {
        margin-top: 14px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .seg-row { margin-top: 14px; }
      .seg-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .seg-read { font-size: 12px; color: var(--card-dim); }
      .segs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        outline: none;
      }
      .segs:focus-visible { box-shadow: 0 0 0 2px var(--accent); border-radius: 4px; }
      .seg {
        height: 26px;
        border-radius: 3px;
        border: 1px solid var(--seg-border);
        background: var(--seg-bg);
        transition: background .18s ease, border-color .18s ease;
      }
      .seg.is-on {
        border-color: var(--accent);
        background: rgba(255, 74, 15, .22);
      }
      .seg.is-preview {
        border-color: rgba(255, 74, 15, .55);
      }

      /* NIGHT LIFE (dark theme only) */
      .home-stars, .home-flies {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      :root[data-theme="light"] .home-stars,
      :root[data-theme="light"] .home-flies {
        display: none;
      }
      .star {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: #fff;
        will-change: opacity;
        animation: star-pulse linear infinite;
      }
      @keyframes star-pulse {
        0%, 100% { opacity: .15; }
        50%      { opacity: .9; }
      }
      .fly {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #FFE9A8;
        box-shadow: 0 0 7px 2px rgba(255, 216, 120, .75);
        will-change: transform, opacity;
        animation: fly-drift ease-in-out infinite alternate, fly-glow ease-in-out infinite;
      }
      @keyframes fly-drift {
        from { transform: translate3d(0, 0, 0); }
        to   { transform: translate3d(var(--dx), var(--dy), 0); }
      }
      @keyframes fly-glow {
        0%, 100% { opacity: .25; }
        50%      { opacity: 1; }
      }

      [data-magnetic] {
        will-change: transform;
      }

      @media (prefers-reduced-motion: reduce) {
        .home-grass-inner, .home-base .home-bg, .star, .fly { animation: none !important; }
        .card.ex, .toast, .macro-bar > i { transition: none !important; }
        .log-row.is-new { animation: none !important; }
        .dots span { animation: none !important; }
        #coach-screen.is-booting { animation: none !important; }
      }

      /* SIDEBAR */
      .planet-list {
        left: clamp(18px, 1.95vw, 28px);
        top: 54%;
        transform: translateY(-43%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 16px;
      }
      .planet-item {
        display: flex;
        align-items: center;
        min-height: 20px;
        color: var(--ink-dim);
        text-shadow: var(--ink-shadow);
        transition: color 0.3s ease, transform 0.2s ease;
        background: transparent;
        border: 0;
        padding: 0;
        margin: 0;
        font-family: inherit;
        font-size: 16px;
        text-align: left;
        cursor: pointer;
      }
      .planet-item:hover {
        color: #fff;
        transform: translateX(3px);
      }
      .planet-item.active {
        color: var(--ink);
        font-size: 18px;
        font-weight: 700;
        gap: 8px;
      }
      .planet-item.active:before {
        content: '';
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        display: inline-block;
        flex-shrink: 0;
      }

      /* PORTAL */
      .portal-wrap {
        left: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        width: min(220px, 18vw);
        transform: none;
        perspective: none;
      }
      .portal-heading {
        color: var(--ink);
        text-shadow: var(--ink-shadow);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 16px;
        opacity: 0;
      }
      .portal-heading strong {
        font-size: 18px;
        margin-left: 8px;
      }
      .portal {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 320 / 350;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 60px;
        background: transparent;
        cursor: pointer;
        box-shadow: none;
        transform: none !important;
      }
      .portal video, .portal img {
        visibility: hidden;
        position: absolute;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
      .portal-canvas {
        position: fixed;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* CONTENT */
      .planet-content {
        left: clamp(28px, 4vw, 58px);
        right: clamp(28px, 3vw, 44px);
        bottom: clamp(24px, 3vh, 30px);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 40px;
      }
      .planet-content h1 {
        font-family: Aalto, 'Arial Narrow', sans-serif;
        font-size: clamp(56px, 15vw, 220px);
        font-weight: 400;
        line-height: .72;
        white-space: nowrap;
        margin: 0 0 -.04em;
        letter-spacing: 0;
        transform: translateX(-32px);
        opacity: 0;
        color: var(--ink);
        text-shadow: var(--ink-shadow);
      }

      /* MISC */
      .transition-layer {
        display: none;
      }
      .scene-canvas {
        display: none;
      }
      .loading {
        position: absolute;
        z-index: 12;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        opacity: 0;
        font-size: 12px;
        letter-spacing: .14em;
        text-transform: uppercase;
        transition: opacity .2s;
        pointer-events: none;
      }
      .experience.is-loading .loading {
        opacity: .8;
      }
      .experience.is-transitioning .header,
      .experience.is-transitioning .planet-list {
        opacity: 1;
        filter: none;
        pointer-events: auto;
      }
      .experience.is-transitioning .shade {
        opacity: 1;
      }
      .experience.is-committing .background {
        transition: none !important;
      }

      /* PRELOADER */
      .preloader {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #000;
        overflow: hidden;
        transition: opacity .7s ease;
      }
      .preloader video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .preloader-shade {
        position: absolute;
        inset: auto 0 0;
        height: 35%;
        background: linear-gradient(to bottom, transparent, #000);
      }
      /* Once the intro clip is done it must stop covering .backgrounds — it sits
         above them in DOM order, so it would pin the intro's last frame forever. */
      .preloader.is-background {
        z-index: 0;
        opacity: 0;
        pointer-events: none;
      }
      .preloader.is-background .preloader-shade {
        opacity: 0;
      }
      .preloader-count {
        position: fixed;
        z-index: 22;
        left: 50%;
        bottom: clamp(22px, 3.1vh, 28px);
        display: flex;
        align-items: flex-end;
        gap: 4px;
        transform: translateX(-50%);
        font-family: 'SF Pro', Arial, sans-serif;
        line-height: 1;
      }
      .preloader-count > span:first-child {
        font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
        font-size: 64px;
        font-weight: 100;
      }
      .preloader-count .percent {
        font-size: 24px;
        padding-bottom: 4px;
      }
      .preloader-count.is-leaving {
        animation: preload-count-out .75s cubic-bezier(.22, 1, .36, 1) both;
      }
      @keyframes preload-count-out {
        to {
          opacity: 0;
          filter: blur(7px);
          transform: translate(-50%, -34px);
        }
      }
      body:not(.preload-complete) .custom-cursor {
        opacity: 0 !important;
      }

      /* CUSTOM CURSOR */
      .custom-cursor {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
        width: 1px;
        height: 1px;
        pointer-events: none;
        opacity: 0;
        transition: opacity .2s ease;
      }
      .custom-cursor.is-visible {
        opacity: 1;
      }
      .cursor-dot, .cursor-orbit {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .cursor-dot {
        width: 12px;
        height: 12px;
        background: #fff;
      }
      .cursor-orbit {
        width: 36px;
        height: 36px;
        border: 1px solid #fff;
        background: rgba(255, 255, 255, .4);
        transition: transform .3s cubic-bezier(.22, 1, .36, 1);
      }
      .custom-cursor.is-enter .cursor-orbit {
        transform: translate(-50%, -50%) scale(1.16);
      }
      .cursor-label {
        position: absolute;
        top: 26px;
        left: 0;
        transform: translateX(-50%) translateY(-4px);
        font: 16px/1.2 'SF Pro', Arial, sans-serif;
        white-space: nowrap;
        opacity: 0;
        transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1);
      }
      .custom-cursor.is-enter .cursor-label {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* TRAIN PANEL */
      .train-head { display: flex; align-items: flex-start; gap: 16px; }
      .train-head > div { flex: 1 1 auto; min-width: 0; }
      .panel-title {
        margin: 6px 0 0;
        font-family: Aalto, 'Archivo Narrow', 'Roboto Condensed', 'Oswald', 'Arial Narrow', sans-serif;
        font-size: clamp(26px, 2.6vw, 38px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: .01em;
        text-transform: uppercase;
        color: var(--ink);
        text-shadow: var(--ink-shadow);
      }
      .btn-outline {
        flex: 0 0 auto;
        padding: 9px 13px;
        border: 1px solid var(--card-border);
        border-radius: 3px;
        background: var(--card-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: var(--card-ink);
        font-family: inherit;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color .25s ease, color .25s ease;
      }
      .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
      /* the per-exercise swap button reads as a sentence, not a label */
      .ex-head .btn-outline {
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: .01em;
        text-transform: none;
      }
      .panel-rule {
        height: 1px;
        margin: 16px 0;
        background: var(--card-border);
      }
      .train-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 13px;
        color: var(--ink);
        opacity: .86;
        text-shadow: var(--ink-shadow);
      }
      .chip {
        padding: 5px 9px;
        border: 1px solid var(--card-border);
        border-radius: 3px;
        background: var(--card-bg);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .train-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      .tab {
        padding: 8px 15px;
        border: 1px solid var(--card-border);
        border-radius: 999px;
        background: var(--card-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: var(--card-ink);
        font-family: inherit;
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
        transition: border-color .25s ease, color .25s ease;
      }
      .tab.is-active { border-color: var(--accent); color: var(--accent); }

      .train-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 16px 0 12px;
        font-size: 13px;
        color: var(--ink);
        text-shadow: var(--ink-shadow);
      }
      .btn-accent.is-small {
        margin-top: 0;
        padding: 8px 12px;
        font-size: 10px;
      }
      /* dim until the first set is ticked; still focusable so the reason is
         announced rather than the control just vanishing */
      .btn-accent[disabled] {
        opacity: .42;
        cursor: not-allowed;
      }

      .ex-list { display: grid; gap: 12px; }
      .card.ex { padding: 16px 18px 14px; transition: opacity .16s ease; }
      .card.ex.is-swapping { opacity: 0; }
      .ex-head { display: flex; align-items: flex-start; gap: 12px; }
      .ex-head > div { flex: 1 1 auto; min-width: 0; }
      .ex-name {
        margin: 0;
        font-family: Aalto, 'Archivo Narrow', 'Roboto Condensed', 'Oswald', 'Arial Narrow', sans-serif;
        font-size: 19px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: .02em;
        text-transform: uppercase;
      }
      .ex-scheme { margin-top: 7px; font-size: 13px; font-weight: 600; }
      .ex-steps {
        margin: 0;
        padding: 0 0 0 2px;
        list-style: none;
        counter-reset: step;
        font-size: 12.5px;
        color: var(--card-dim);
      }
      .ex-steps li { counter-increment: step; margin-top: 5px; }
      .ex-steps li::before { content: counter(step) '. '; }

      .set-row {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 8px;
        transition: opacity .25s ease;
      }
      .set-row.is-done { opacity: .5; }
      .set-label {
        flex: 0 0 42px;
        font-size: 12px;
        color: var(--card-dim);
      }
      .set-row input {
        width: 62px;
        padding: 7px 9px;
        border: 1px solid var(--seg-border);
        border-radius: 3px;
        background: var(--seg-bg);
        color: var(--card-ink);
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
      }
      .set-row input::placeholder { font-weight: 400; color: var(--card-dim); }
      .set-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .set-unit { font-size: 11.5px; color: var(--card-dim); }
      .set-check {
        margin-left: auto;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 1px solid var(--card-border);
        border-radius: 3px;
        background: transparent;
        color: var(--card-dim);
        cursor: pointer;
        transition: background .2s ease, border-color .2s ease, color .2s ease;
      }
      .set-check svg { width: 15px; height: 15px; }
      .set-check.is-on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .rest-chip {
        margin-top: 12px;
        padding: 7px 11px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        background: transparent;
        color: var(--accent);
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .train-finish { margin: 16px 0 4px; }
      .btn-accent.is-big {
        margin-top: 0;
        width: 100%;
        padding: 15px 18px;
        font-size: 12.5px;
      }

      /* EAT PANEL */
      .eat-head { display: flex; align-items: flex-start; gap: 16px; }
      .eat-head > div { flex: 1 1 auto; min-width: 0; }
      .eat-head .chip { flex: 0 0 auto; margin-top: 8px; cursor: pointer; }
      .eat-head .chip:hover { border-color: var(--accent); color: var(--accent); }

      .card.targets { position: relative; }
      .targets-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .link-macro {
        border: 0;
        padding: 0;
        background: none;
        color: var(--accent);
        font-family: inherit;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .macro-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-top: 16px;
      }
      .macro-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 6px;
        font-size: 12.5px;
      }
      .macro-name { font-weight: 700; }
      .macro-read { color: var(--card-dim); font-size: 11.5px; white-space: nowrap; }
      /* over target: the number calls it out, the bar stays capped at 100% */
      .macro-read.is-over { color: var(--accent); }
      .macro-bar {
        margin-top: 9px;
        height: 3px;
        border-radius: 2px;
        overflow: hidden;
        /* the track is the macro's own colour, faded: at 0 the row still reads
           as four coloured lines the way the reference does */
        background: color-mix(in srgb, var(--c) 34%, transparent);
      }
      .macro-bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--c);
        transition: width 1.1s cubic-bezier(.16, 1, .3, 1);
      }

      .derived-pop {
        position: absolute;
        z-index: 2;
        right: 18px;
        top: 44px;
        width: min(300px, calc(100% - 36px));
        padding: 13px 15px;
        border: 1px solid var(--card-border);
        border-radius: 3px;
        background: var(--solid-bg);
        color: var(--solid-ink);
        font-size: 12.5px;
        line-height: 1.45;
      }
      .derived-pop button {
        margin-top: 10px;
        border: 0;
        padding: 0;
        background: none;
        color: var(--accent);
        font-family: inherit;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        cursor: pointer;
      }

      /* text tabs with an underline, not the pills Train uses */
      .eat-tabs {
        display: flex;
        gap: 22px;
        margin: 18px 0 0;
        border-bottom: 1px solid var(--card-border);
      }
      .tab-text {
        position: relative;
        border: 0;
        padding: 0 0 9px;
        background: none;
        color: var(--ink);
        opacity: .6;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        cursor: pointer;
        text-shadow: var(--ink-shadow);
        transition: opacity .25s ease, color .25s ease;
      }
      .tab-text:hover { opacity: 1; }
      .tab-text.is-active { opacity: 1; color: var(--accent); }
      .tab-text.is-active::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: var(--accent);
      }
      .eat-body { margin-top: 14px; display: grid; gap: 12px; }

      .empty-card { padding: 34px 18px; text-align: center; }
      .empty-title { font-size: 14px; }
      .empty-sub { margin-top: 7px; font-size: 12.5px; color: var(--card-dim); }

      .meal-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
      }
      .meal-name {
        font-size: 10.5px;
        letter-spacing: .17em;
        text-transform: uppercase;
        color: var(--card-dim);
      }
      .meal-kcal { font-size: 11.5px; color: var(--card-dim); }

      .log-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 0;
        border-top: 1px solid var(--card-border);
      }
      .log-row:first-of-type { border-top: 0; }
      .log-row > div { flex: 1 1 auto; min-width: 0; }
      .log-name { font-size: 13.5px; }
      .log-serve { margin-top: 3px; font-size: 11.5px; color: var(--card-dim); }
      .log-kcal { flex: 0 0 auto; font-size: 13px; font-weight: 700; }
      .log-macros { flex: 0 0 auto; font-size: 11.5px; color: var(--card-dim); white-space: nowrap; }
      .icon-btn {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: 1px solid var(--card-border);
        border-radius: 3px;
        background: transparent;
        color: var(--card-dim);
        font-family: inherit;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        transition: border-color .2s ease, color .2s ease;
      }
      .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
      /* a freshly added row announces itself, then settles */
      .log-row.is-new { animation: log-in 1.6s ease both; }
      @keyframes log-in {
        0%   { background: color-mix(in srgb, var(--accent) 30%, transparent); }
        100% { background: transparent; }
      }

      .add-controls { display: flex; gap: 9px; margin-bottom: 12px; }
      .add-controls input, .add-controls select {
        padding: 9px 11px;
        border: 1px solid var(--seg-border);
        border-radius: 3px;
        background: var(--seg-bg);
        color: var(--card-ink);
        font-family: inherit;
        font-size: 13px;
      }
      .add-controls input { flex: 1 1 auto; min-width: 0; }
      .add-controls select { flex: 0 0 auto; }
      .add-controls input:focus-visible,
      .add-controls select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      .food-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 0;
        border-top: 1px solid var(--card-border);
      }
      .food-row:first-of-type { border-top: 0; }
      .food-row > div:first-child { flex: 1 1 auto; min-width: 0; }
      .food-name { font-size: 13.5px; }
      .food-macros { margin-top: 3px; font-size: 11.5px; color: var(--card-dim); }
      .stepper {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 2px;
        border: 1px solid var(--seg-border);
        border-radius: 3px;
        background: var(--seg-bg);
      }
      .stepper button {
        width: 26px;
        height: 26px;
        border: 0;
        background: none;
        color: var(--card-ink);
        font-family: inherit;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }
      .stepper button:hover { color: var(--accent); }
      .stepper span {
        min-width: 30px;
        text-align: center;
        font-size: 12.5px;
        font-weight: 700;
      }
      .food-empty { padding: 18px 0; font-size: 12.5px; color: var(--card-dim); }

      .plan-intro { font-size: 12.5px; color: var(--card-dim); margin-bottom: 12px; }
      .plan-total {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--card-border);
        font-size: 12.5px;
      }

      /* PROGRESS PANEL */
      .prog-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .prog-big {
        display: flex;
        align-items: baseline;
        gap: 9px;
        margin-top: 12px;
      }
      .prog-num {
        font-family: Aalto, 'Archivo Narrow', 'Roboto Condensed', 'Oswald', 'Arial Narrow', sans-serif;
        font-size: 46px;
        line-height: .9;
      }
      .prog-unit { font-size: 13px; color: var(--card-dim); }
      .prog-note { margin-top: 12px; font-size: 11.5px; color: var(--card-dim); }
      .prog-body { margin-top: 10px; font-size: 13px; line-height: 1.5; }
      .prog-body .accent { color: var(--accent); }

      .weight-row { display: flex; gap: 9px; margin-top: 12px; }
      .weight-row input {
        flex: 1 1 auto;
        min-width: 0;
        padding: 9px 11px;
        border: 1px solid var(--seg-border);
        border-radius: 3px;
        background: var(--seg-bg);
        color: var(--card-ink);
        font-family: inherit;
        font-size: 13px;
      }
      .weight-row input::placeholder { color: var(--card-dim); }
      .weight-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .spark { display: block; margin-top: 12px; width: 100%; height: 38px; overflow: visible; }
      .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
      .spark circle { fill: var(--accent); }
      .spark line { stroke: var(--card-border); stroke-width: 1; }
      .weight-delta { font-size: 12.5px; color: var(--card-dim); margin-top: 6px; }

      .prog-section {
        margin: 22px 0 0;
        font-family: Aalto, 'Archivo Narrow', 'Roboto Condensed', 'Oswald', 'Arial Narrow', sans-serif;
        font-size: clamp(20px, 2vw, 27px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: .01em;
        text-transform: uppercase;
        color: var(--ink);
        text-shadow: var(--ink-shadow);
      }

      .change-list { display: grid; gap: 16px; }
      .change {
        position: relative;
        padding-left: 14px;
      }
      .change::before {
        content: '';
        position: absolute;
        left: 0;
        top: 2px;
        bottom: 2px;
        width: 2px;
        background: var(--accent);
      }
      .change-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 9px;
      }
      .change-title {
        margin: 0;
        font-family: Aalto, 'Archivo Narrow', 'Roboto Condensed', 'Oswald', 'Arial Narrow', sans-serif;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: .02em;
        text-transform: uppercase;
        color: var(--ink);
        text-shadow: var(--ink-shadow);
      }
      .badge {
        padding: 3px 7px;
        border: 1px solid var(--accent);
        border-radius: 3px;
        color: var(--accent);
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      .badge.is-accepted { border-color: #6FBF8B; color: #6FBF8B; }
      .badge.is-dismissed {
        border-color: var(--card-border);
        color: var(--ink);
        opacity: .55;
      }
      .change-date {
        font-size: 11.5px;
        color: var(--ink);
        opacity: .6;
        text-shadow: var(--ink-shadow);
      }
      .change-desc {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink);
        text-shadow: var(--ink-shadow);
      }
      .change-basis {
        margin-top: 11px;
        font-size: 10px;
        letter-spacing: .17em;
        text-transform: uppercase;
        color: var(--ink);
        opacity: .55;
        text-shadow: var(--ink-shadow);
      }
      .change-basis + ul {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        font-size: 11.5px;
        color: var(--ink);
        opacity: .6;
        text-shadow: var(--ink-shadow);
      }
      .change-basis + ul li { margin-top: 3px; }
      .change-basis + ul li::before { content: '\00b7  '; }
      .change-actions { display: flex; gap: 8px; margin-top: 12px; }
      .btn-mini {
        padding: 6px 12px;
        border: 1px solid var(--card-border);
        border-radius: 3px;
        background: var(--card-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: var(--card-ink);
        font-family: inherit;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color .25s ease, color .25s ease;
      }
      .btn-mini:hover { border-color: var(--accent); color: var(--accent); }
      .btn-mini.is-accept:hover { border-color: #6FBF8B; color: #6FBF8B; }

      /* COACH: the monitor screen */
      #coach-screen {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        border-radius: 6px;
        overflow: hidden;
        background: #041b23;
        opacity: 0;
        pointer-events: none;
        transition: opacity .5s ease;
      }
      :root[data-theme="light"] #coach-screen { background: #05222c; }
      #coach-screen.is-on {
        opacity: 1;
        pointer-events: auto;
      }
      /* the 120ms mains-flicker as the panel wakes */
      #coach-screen.is-booting { animation: screen-boot .42s steps(1, end) both; }
      @keyframes screen-boot {
        0%   { filter: brightness(0); }
        26%  { filter: brightness(0); }
        32%  { filter: brightness(1.9); }
        38%  { filter: brightness(.25); }
        44%  { filter: brightness(1.35); }
        100% { filter: brightness(1); }
      }
      /* the glass catches the window behind it */
      .screen-glare {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(142deg, rgba(255, 255, 255, .11) 0%, rgba(255, 255, 255, .03) 26%, transparent 52%);
      }
      .screen-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 44px rgba(0, 0, 0, .55), inset 0 0 8px rgba(0, 0, 0, .5);
      }
      /* the UI is laid out at a fixed size and scaled to whatever the bezel is */
      .screen-fit {
        position: absolute;
        left: 0;
        top: 0;
        width: 800px;
        height: 480px;
        transform-origin: 0 0;
      }
      /* Coach has no right-hand panel on a wide viewport, and the desk should not
         be covered by the section title either. */
      @media (min-width: 900px) {
        .experience[data-planet="progress"] .planet-content { display: none; }
        #coach-panel { display: none !important; }
      }
      @media (max-width: 899px) {
        #coach-screen { display: none; }
      }

      /* COACH CHAT (same markup in the screen and in the mobile panel) */
      .coach-ui {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 20px 22px 16px;
        color: #E8F2F4;
        opacity: 0;
        transition: opacity .45s ease;
      }
      .coach-ui.is-in { opacity: 1; }
      .coach-head { display: flex; align-items: flex-start; gap: 12px; }
      .coach-head > div { flex: 1 1 auto; min-width: 0; }
      .coach-eyebrow {
        font-size: 10px;
        letter-spacing: .17em;
        text-transform: uppercase;
        opacity: .6;
      }
      .coach-title {
        margin: 5px 0 0;
        font-family: Aalto, 'Archivo Narrow', 'Roboto Condensed', 'Oswald', 'Arial Narrow', sans-serif;
        font-size: 30px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: .01em;
        text-transform: uppercase;
      }
      .coach-clear {
        flex: 0 0 auto;
        border: 0;
        padding: 0;
        background: none;
        color: var(--accent);
        font-family: inherit;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .coach-rule { height: 1px; margin: 13px 0; background: rgba(232, 242, 244, .14); }

      .coach-actions { display: flex; flex-wrap: wrap; gap: 6px; }

        border: 1px solid rgba(232, 242, 244, .22);

      .coach-log {

        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: 74%;
        padding: 11px 13px;
        border: 1px solid rgba(232, 242, 244, .16);

        background: rgba(232, 242, 244, .05);
        font-size: 12.5px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .bubble.is-user {
        align-self: flex-end;
        border-color: rgba(232, 242, 244, .22);
        background: rgba(232, 242, 244, .1);
      }
      .bubble.is-coach { align-self: flex-start; }
      .bubble .accent { color: var(--accent); }
      .bubble-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .bubble-actions button {
        padding: 5px 10px;

        background: none;

      .dots { display: inline-flex; gap: 4px; align-items: center; height: 10px; }

      @keyframes dot-bob {

      .coach-form { display: flex; gap: 8px; margin-top: 12px; }
      .coach-form input {
        flex: 1 1 auto;
        min-width: 0;

        background: rgba(232, 242, 244, .05);
        color: inherit;
        font-family: inherit;
        font-size: 12.5px;
      }
      .coach-form input::placeholder { color: rgba(232, 242, 244, .45); }
      .coach-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .coach-send {
        flex: 0 0 auto;
        width: 42px;
        border: 0;
        border-radius: 3px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        cursor: pointer;
        transition: opacity .2s ease;
      }
      .coach-send[disabled] { opacity: .4; cursor: not-allowed; }
      .coach-foot { margin-top: 9px; font-size: 9.5px; line-height: 1.45; opacity: .5; }

      /* only shown when the live coach could not be reached */
      .coach-offline {
        position: absolute;
        right: 12px;
        bottom: 10px;
        display: none;
        align-items: center;
        gap: 5px;
        font-size: 9px;
        letter-spacing: .1em;
        text-transform: uppercase;
        opacity: .45;
      }
      .coach-offline.is-on { display: flex; }
      .coach-offline::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
      }

      /* in the mobile panel the chat is a glass card, not a screen */
      #coach-panel .coach-ui {
        position: relative;
        inset: auto;
        opacity: 1;
        height: 100%;
        padding: 0;
        color: var(--ink);
        text-shadow: var(--ink-shadow);
      }
      #coach-panel .coach-title { font-size: clamp(26px, 7vw, 34px); }
      #coach-panel .coach-rule { background: var(--card-border); }
      #coach-panel .qa {
        border-color: var(--card-border);
        background: var(--card-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: var(--card-ink);
        text-shadow: none;
      }
      #coach-panel .bubble {
        border-color: var(--card-border);

      /* TOAST */
      .toast {
        position: absolute;
        z-index: 9;
        left: 50%;
        bottom: 34px;
        transform: translate(-50%, 14px);

        border-radius: 3px;
        background: var(--solid-bg);
        color: var(--solid-ink);
        font-size: 12.5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .3s ease, transform .3s ease;
      }
      .toast.is-on { opacity: 1; transform: translate(-50%, 0); }

      /* ENTRANCE / SWITCH ANIMATIONS */
      body:not(.intro-ready) .header,
      body:not(.intro-ready) .planet-list,
      body:not(.intro-ready) .planet-content h1,
      body:not(.intro-ready) .section-panel {
        opacity: 0;
      }
      .intro-ready .header {
        animation: reveal-down .9s cubic-bezier(.22, 1, .36, 1) .1s both;
      }
      .intro-ready .planet-list {
        animation: reveal-side .9s cubic-bezier(.22, 1, .36, 1) .65s both;
      }
      .content-revealing h1 {
        animation: title-rise 1.05s cubic-bezier(.16, 1, .3, 1) both;
      }
      .content-revealing .section-panel {
        animation: panel-rise .95s cubic-bezier(.16, 1, .3, 1) .15s both;
      }
      @keyframes panel-rise {
        from { opacity: 0; filter: blur(9px); transform: translateY(26px); }
        to   { opacity: 1; filter: blur(0); transform: translateY(0); }
      }

      .mask-revealing .portal-heading {
        animation: portal-caption .85s cubic-bezier(.22, 1, .36, 1) both;
      }
      .planet-list.is-switching .planet-item {
        animation: menu-row .58s cubic-bezier(.22, 1, .36, 1) both;
      }
      .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
      .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
      .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
      .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
      .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
      .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
      .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .2s; }

      .planet-list.is-switching .planet-item.active:before {
        animation: active-dot .55s cubic-bezier(.22, 1, .36, 1) .18s both;
      }

      @keyframes reveal-down {
        from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
        to { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes reveal-side {
        from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
        to { opacity: 1; filter: blur(0); transform: translate(0, -43%); }
      }
      @keyframes title-rise-flush {
        from { opacity: 0; filter: blur(12px); transform: translateY(42px); }
        to { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes title-rise {
        from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
        to { opacity: 1; filter: blur(0); transform: translate(-32px, 0); }
      }
      @keyframes portal-caption {
        from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
        to { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes menu-row {
        from { opacity: .35; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes active-dot {
        from { opacity: 0; transform: scale(0); }
        to { opacity: 1; transform: scale(1); }
      }

      /* RESPONSIVE */
      @media (max-width: 900px) {
        .nav { display: none; }
        .portal-wrap { width: min(180px, 26vw); }
        .planet-content h1 { font-size: clamp(52px, 17vw, 150px); }
        .experience:has(.section-panel.is-active) .planet-content {
          top: 258px;
          bottom: auto;
        }
        /* a full-width panel leaves no room beside the rail; the portal still
           navigates, and the rail is already hidden below 640 by the base design.
           :has() keeps this tied to "a panel is showing", not to one section. */
        .experience:has(.section-panel.is-active) .planet-list {
          display: none;
        }
        .experience:has(.section-panel.is-active) .planet-content h1 {
          font-size: clamp(40px, 9vw, 72px);
          transform: translateX(0);
        }
        .experience:has(.section-panel.is-active).content-revealing h1 {
          animation-name: title-rise-flush;
        }
        .section-panel {
          left: 18px;
          right: 18px;
          width: auto;
          top: 344px;
          bottom: 18px;
        }
        .planet-list { font-size: 14px; }
        .planet-item.active { font-size: 16px; }

      @media (max-width: 900px) {

        .prog-grid { grid-template-columns: 1fr; }

      @media (max-width: 640px) {
        .experience { min-height: 600px; }
        .eat-tabs { gap: 16px; }
        .log-macros, .food-macros { display: none; }
        .planet-list { display: none; }
        .portal-wrap { width: min(140px, 38vw); }
        .panel-grid { grid-template-columns: 1fr; }
        .experience:has(.section-panel.is-active) .planet-content { top: 218px; }
        .experience:has(.section-panel.is-active) .planet-content h1 { font-size: clamp(34px, 11vw, 56px); }
        .section-panel { top: 284px; }
        .card-big { font-size: 30px; }
        .stat-num { font-size: 38px; }
        .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
        .planet-content h1 { font-size: clamp(44px, 17vw, 110px); margin-bottom: 20px; }
        .portal-heading { font-size: 14px; }
        .portal-heading strong { font-size: 16px; }
        .menu { height: 38px; }
        .portal { border-radius: 40px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: .01ms !important; }
        .portal { transform: none !important; }
      }
    </style>
    <script>
      (function() {

        if (t !== 'light' && t !== 'dark') {

        }

  <body>
