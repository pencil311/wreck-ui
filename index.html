          const t = { kcal: 0, p: 0, c: 0, f: 0 };
          eatLog.forEach(function (it) {
            const fd = foodById(it.foodId);
            if (!fd) return;
            MACRO_KEYS.forEach(function (k) { t[k] += fd[k] * it.servings; });
          });
          return t;
        }

        function round1(v) { return Math.round(v * 10) / 10; }
        function servingLabel(fd, servings) {
          return (servings === 1 ? '' : servings + ' \u00d7 ') + fd.serving;
        }

        function macroCellHtml(m, value) {
          const over = value > m.target;
          const shown = m.key === 'kcal' ? Math.round(value).toLocaleString() : round1(value);
          return '<div class="macro" style="--c: ' + m.color + '">' +
              '<div class="macro-top"><span class="macro-name">' + m.label + '</span>' +
              '<span class="macro-read' + (over ? ' is-over' : '') + '" data-macro="' + m.key + '">' +
                shown + ' / ' + m.target.toLocaleString() + '</span></div>' +
              '<div class="macro-bar"><i data-macro-fill="' + m.key + '" style="width:' +
                Math.min(100, m.target ? value / m.target * 100 : 0).toFixed(1) + '%"></i></div>' +
            '</div>';
        }

        // Patches the four numbers and bars in place. Used after every add/remove
        // so the Add food search box never loses focus to a full rebuild.
        function syncMacros(animate) {
          const t = eatTotals();
          eatData.macros.forEach(function (m) {
            const read = eatPanelEl.querySelector('[data-macro="' + m.key + '"]');
            const fill = eatPanelEl.querySelector('[data-macro-fill="' + m.key + '"]');
            const value = t[m.key];
            if (fill) fill.style.width = Math.min(100, m.target ? value / m.target * 100 : 0).toFixed(1) + '%';
            if (!read) return;
            read.classList.toggle('is-over', value > m.target);
            const text = function (v) {
              return (m.key === 'kcal' ? Math.round(v).toLocaleString() : round1(v)) + ' / ' + m.target.toLocaleString();
            };
            if (animate && value > 0) {
              const from = Number(read.getAttribute('data-from')) || 0;
              animateValue(function (p) { read.textContent = text(from + (value - from) * p); }, 700);
            } else {
              read.textContent = text(value);
            }
            read.setAttribute('data-from', value);
          });
          syncHomeCalories();
        }

        // Home's calories card is the one place Eat writes outside itself
        function syncHomeCalories() {
          const kcal = Math.round(eatTotals().kcal);
          if (homeData.calories.value === kcal) return;
          homeData.calories.value = kcal;
          buildPanel();
          refreshCards();
          if (current === 'mercury') playPanelReveal();
        }

        function logTabHtml() {
          if (!eatLog.length) {
            return '<article class="card empty-card">' +
                '<div class="empty-title">' + eatData.empty.title + '</div>' +
                '<div class="empty-sub">' + eatData.empty.sub + '</div>' +
              '</article>';
          }
          return eatData.meals.map(function (meal) {
            const items = eatLog.filter(function (it) { return it.meal === meal; });
            if (!items.length) return '';
            let kcal = 0;
            const rows = items.map(function (it) {
              const fd = foodById(it.foodId);
              kcal += fd.kcal * it.servings;
              return '<div class="log-row' + (it.id === newRowId ? ' is-new' : '') + '">' +
                  '<div><div class="log-name">' + fd.name + '</div>' +
                  '<div class="log-serve">' + servingLabel(fd, it.servings) + '</div></div>' +
                  '<span class="log-kcal">' + Math.round(fd.kcal * it.servings) + '</span>' +
                  '<span class="log-macros">P ' + round1(fd.p * it.servings) + ' \u00b7 C ' + round1(fd.c * it.servings) +
                    ' \u00b7 F ' + round1(fd.f * it.servings) + '</span>' +
                  '<button class="icon-btn" type="button" data-remove="' + it.id +
                    '" data-cursor="Remove" aria-label="Remove ' + fd.name + '">\u00d7</button>' +
                '</div>';
            }).join('');
            return '<article class="card">' +
                '<div class="meal-head"><span class="meal-name">' + meal + '</span>' +
                '<span class="meal-kcal">' + Math.round(kcal) + ' kcal</span></div>' + rows +
              '</article>';
          }).join('');
        }

        function foodListHtml() {
          const q = foodQuery.trim().toLowerCase();
          const list = eatData.foods.filter(function (fd) {
            return !q || fd.name.toLowerCase().indexOf(q) > -1;
          });
          if (!list.length) return '<div class="food-empty">No food matches \u201c' + foodQuery + '\u201d.</div>';
          return list.map(function (fd) {
            const sv = addServings[fd.id] || 1;
            return '<div class="food-row" data-food="' + fd.id + '">' +
                '<div><div class="food-name">' + fd.name + '</div>' +
                '<div class="food-macros">' + fd.serving + ' \u00b7 ' + fd.kcal + ' kcal \u00b7 P ' + fd.p +
                  ' \u00b7 C ' + fd.c + ' \u00b7 F ' + fd.f + '</div></div>' +
                '<div class="stepper">' +
                  '<button type="button" data-step="-1" aria-label="Less ' + fd.name + '">\u2212</button>' +
                  '<span data-serve="' + fd.id + '">' + sv + '</span>' +
                  '<button type="button" data-step="1" aria-label="More ' + fd.name + '">+</button>' +
                '</div>' +
                '<button class="btn-accent is-small" type="button" data-add="' + fd.id + '" data-cursor="Add">Add</button>' +
              '</div>';
          }).join('');
        }

        function addTabHtml() {
          const opts = eatData.meals.map(function (m) {
            return '<option value="' + m + '"' + (m === addMeal ? ' selected' : '') + '>' + m + '</option>';
          }).join('');
          return '<article class="card">' +
              '<div class="add-controls">' +
                '<input id="food-search" type="search" placeholder="Search food" value="' + foodQuery + '" aria-label="Search food" />' +
                '<select id="meal-select" aria-label="Meal">' + opts + '</select>' +
              '</div>' +
              '<div id="food-list">' + foodListHtml() + '</div>' +
            '</article>';
        }

        // TODO: placeholder generator -- fills each meal from its own foods until
        // the meal's slice of the calorie target is covered. Not nutrition advice.
        function buildDayPlan() {
          const kcalTarget = eatData.macros[0].target;
          const share = { Breakfast: 0.25, Lunch: 0.3, Snacks: 0.15, Dinner: 0.3 };
          return eatData.meals.map(function (meal) {
            const budget = kcalTarget * share[meal];
            const pool = eatData.foods.filter(function (fd) { return fd.meal === meal; });
            const items = [];
            let kcal = 0;
            // stop once the meal is close enough rather than always adding a
            // whole extra serving, which used to overshoot every budget
            for (let i = 0; i < pool.length && kcal < budget * 0.9; i++) {
              const need = (budget - kcal) / pool[i].kcal;
              const servings = Math.max(1, Math.round(need * 2) / 2);
              items.push({ foodId: pool[i].id, servings: servings });
              kcal += pool[i].kcal * servings;
            }
            return { meal: meal, items: items };
          });
        }

        let dayPlan = null;

        function planTabHtml() {
          if (!dayPlan) {
            return '<article class="card">' +
                '<div class="plan-intro">A starting point for the day, built from the regional list to land near your targets.</div>' +
                '<button class="btn-accent" type="button" id="make-plan" data-cursor="Build" data-magnetic>Build my day plan</button>' +
              '</article>';
          }
          const cards = dayPlan.map(function (grp) {
            let kcal = 0;
            const rows = grp.items.map(function (it) {
              const fd = foodById(it.foodId);
              kcal += fd.kcal * it.servings;
              return '<div class="log-row"><div><div class="log-name">' + fd.name + '</div>' +
                '<div class="log-serve">' + servingLabel(fd, it.servings) + '</div></div>' +
                '<span class="log-kcal">' + Math.round(fd.kcal * it.servings) + '</span></div>';
            }).join('');
            return '<article class="card">' +
                '<div class="meal-head"><span class="meal-name">' + grp.meal + '</span>' +
                '<span class="meal-kcal">' + Math.round(kcal) + ' kcal</span></div>' + rows +
              '</article>';
          }).join('');
          let total = 0;
          dayPlan.forEach(function (grp) {
            grp.items.forEach(function (it) { total += foodById(it.foodId).kcal * it.servings; });
          });
          return cards + '<article class="card">' +
              '<div class="plan-total">Plan total: ' + Math.round(total) + ' kcal of ' +
                eatData.macros[0].target.toLocaleString() + '</div>' +
              '<button class="btn-accent" type="button" id="add-plan" data-cursor="Add" data-magnetic>Add all to log</button>' +
              '<button class="btn-outline" type="button" id="redo-plan" data-cursor="Build">Rebuild</button>' +
            '</article>';
        }

        let addMeal = eatData.meals[0];

        function buildEatPanel() {
          const t = eatTotals();
          const tabs = eatData.tabs.map(function (tb) {
            return '<button class="tab-text' + (tb.key === eatTab ? ' is-active' : '') + '" type="button" data-eat-tab="' +
              tb.key + '" aria-pressed="' + (tb.key === eatTab ? 'true' : 'false') + '">' + tb.label + '</button>';
          }).join('');

          const body = eatTab === 'add' ? addTabHtml() : eatTab === 'plan' ? planTabHtml() : logTabHtml();

          eatPanelEl.innerHTML =
            '<div class="panel-head eat-head">' +
              '<div>' +
                '<div class="panel-eyebrow">' + eatData.eyebrow + '</div>' +
                '<h2 class="panel-title">' + eatData.title + '</h2>' +
              '</div>' +
              '<button class="chip" type="button" id="regional-chip" data-cursor="Open">' + eatData.chip + '</button>' +
            '</div>' +
            '<div class="panel-rule"></div>' +
            '<article class="card targets">' +
              '<div class="targets-head"><span class="card-label">' + eatData.targetsLabel + '</span>' +
              '<button class="link-macro" type="button" id="how-derived" data-cursor="Open">' + eatData.derivedCta + '</button></div>' +
              '<div class="macro-grid">' + eatData.macros.map(function (m) { return macroCellHtml(m, t[m.key]); }).join('') + '</div>' +
              (derivedOpen ? '<div class="derived-pop">' + eatData.derivedCopy +
                '<div><button type="button" id="close-derived">Close</button></div></div>' : '') +
            '</article>' +
            '<div class="eat-tabs" role="group" aria-label="Eat views">' + tabs + '</div>' +
            '<div class="eat-body">' + body + '</div>';

          eatData.macros.forEach(function (m) {
            const read = eatPanelEl.querySelector('[data-macro="' + m.key + '"]');
            if (read) read.setAttribute('data-from', t[m.key]);
          });

          refreshCards();
          refreshMagnets();
        }

        function addFood(foodId, meal, servings) {
          const fd = foodById(foodId);
          if (!fd || !(servings > 0)) return;
          const entry = { id: 'l' + Math.random().toString(36).slice(2, 9), foodId: foodId, meal: meal, servings: servings };
          eatLog.push(entry);
          saveEatLog();
          newRowId = entry.id;
          eatTab = 'log';
          buildEatPanel();
          syncMacros(true);
          toast('Added ' + fd.name + ' to ' + meal);
          setTimeout(function () {
            if (newRowId !== entry.id) return;
            newRowId = null;
            const row = eatPanelEl.querySelector('.log-row.is-new');
            if (row) row.classList.remove('is-new');
          }, 1700);
        }

        function removeLogItem(id) {
          const before = eatLog.length;
          eatLog = eatLog.filter(function (it) { return it.id !== id; });
          if (eatLog.length === before) return;
          saveEatLog();
          buildEatPanel();
          syncMacros(false);
        }

        eatPanelEl.addEventListener('click', function (e) {
          const t = e.target;

          const tab = t.closest('[data-eat-tab]');
          if (tab) {
            const key = tab.getAttribute('data-eat-tab');
            if (key === eatTab) return;
            eatTab = key;
            newRowId = null;
            buildEatPanel();
            return;
          }

          const step = t.closest('[data-step]');
          if (step) {
            const row = step.closest('[data-food]');
            const id = row.getAttribute('data-food');
            const next = Math.max(0.5, Math.min(20, (addServings[id] || 1) + Number(step.getAttribute('data-step')) * 0.5));
            addServings[id] = next;
            row.querySelector('[data-serve="' + id + '"]').textContent = next;
            return;
          }

          const add = t.closest('[data-add]');
          if (add) {
            const id = add.getAttribute('data-add');
            addFood(id, addMeal, addServings[id] || 1);
            return;
          }

          const rem = t.closest('[data-remove]');
          if (rem) { removeLogItem(rem.getAttribute('data-remove')); return; }

          if (t.closest('#how-derived')) { derivedOpen = true; buildEatPanel(); return; }
          if (t.closest('#close-derived')) { derivedOpen = false; buildEatPanel(); return; }
          if (t.closest('#regional-chip')) { toast(eatData.chipToast); return; }

          if (t.closest('#make-plan') || t.closest('#redo-plan')) { dayPlan = buildDayPlan(); buildEatPanel(); return; }
          if (t.closest('#add-plan')) {
            const plan = dayPlan || [];
            let last = null;
            plan.forEach(function (grp) {
              grp.items.forEach(function (it) {
                last = { id: 'l' + Math.random().toString(36).slice(2, 9), foodId: it.foodId, meal: grp.meal, servings: it.servings };
                eatLog.push(last);
              });
            });
            saveEatLog();
            dayPlan = null;
            eatTab = 'log';
            buildEatPanel();
            syncMacros(true);
            toast('Day plan added to today\u2019s log');
          }
        });

        // the search only replaces the list, so the field keeps focus and caret
        eatPanelEl.addEventListener('input', function (e) {
          if (e.target.id !== 'food-search') return;
          foodQuery = e.target.value;
          const list = eatPanelEl.querySelector('#food-list');
          if (list) list.innerHTML = foodListHtml();
        });

        eatPanelEl.addEventListener('change', function (e) {
          if (e.target.id === 'meal-select') addMeal = e.target.value;
        });


        /* ---- PROGRESS ---- */
        // Copy and thresholds in one place; the numbers come from the stores that
        // Train, Eat and Home's check-in already write.
        const progressData = {
          eyebrow: 'Progress',
          title: 'What is changing',
          changesTitle: 'What WRECK changed, and why',
          weightKey: 'pj-weight',
          decisionsKey: 'pj-progress-decisions',
          windowDays: 7,
          // TODO: tune with me
          lowReadiness: 50,
          proteinShortfall: 0.7,
          proteinMinDays: 3,
          cards: {
            adherence: { label: 'Training adherence', unit: 'of 4 this week', color: '#6FBF8B' },
            protein:   { label: 'Protein adherence', color: '#FF4A0F',
                         empty: 'No food logged this week yet.' },
            weight:    { label: 'Body weight', empty: 'No entries yet.',
                         placeholder: "Today's weight (kg)", cta: 'Log' },
            consistency: { label: 'Consistency',
                           tail: 'The <span class="accent">habit</span> is the metric that matters most early on. Keep showing up.' }
          },
          emptyChange: 'Nothing changed yet. Log a check-in, a session or a meal and WRECK will explain every adjustment here.'
        };

        const progressPanelEl = document.getElementById('progress-panel');

        function readJson(key, fallback) {
          try {
            const v = JSON.parse(localStorage.getItem(key) || 'null');
            return v === null ? fallback : v;
          } catch (e) { return fallback; }
        }
        function writeJson(key, value) {
          try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
        }

        // "this week" is the last N days including today, not a Monday reset:
        // a streak should not blank out at midnight on Sunday
        function recentKeys() {
          const out = [];
          const now = new Date();
          for (let i = 0; i < progressData.windowDays; i++) {
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
            out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
          }
          return out;
        }

        // Train writes one key per session tab per day; count the finished ones
        function trainStats() {
          const recent = recentKeys();
          let week = 0, allTime = 0;
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const m = key && key.match(/^pj-train-(\d{4}-\d{2}-\d{2})-\d+$/);
            if (!m) continue;
            const rec = readJson(key, null);
            if (!rec || !rec.done) continue;
            allTime++;
            if (recent.indexOf(m[1]) > -1) week++;
          }
          return { week: week, allTime: allTime };
        }

        // average daily protein over the days that actually have entries
        function eatStats() {
          let total = 0, days = 0;
          recentKeys().forEach(function (date) {
            const log = readJson('pj-eat-' + date, null);
            if (!Array.isArray(log) || !log.length) return;
            let p = 0;
            log.forEach(function (it) {
              const fd = foodById(it.foodId);
              if (fd) p += fd.p * it.servings;
            });
            total += p;
            days++;
          });
          return { avg: days ? total / days : 0, days: days };
        }

        function weightEntries() {
          const raw = readJson(progressData.weightKey, []);
          if (!Array.isArray(raw)) return [];
          return raw
            .filter(function (e) { return e && typeof e.date === 'string' && Number(e.kg) > 0; })
            .map(function (e) { return { date: e.date, kg: Number(e.kg) }; })
            .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
        }

        // Prefers what Home actually saved; falls back to the live sliders so a
        // check-in that was adjusted but not logged still reads through.
        function checkinValues() {
          const saved = readJson('pj-checkin', null);
          const out = {};
          checkin.fields.forEach(function (fld) {
            const v = saved && saved[fld.key];
            out[fld.key] = (typeof v === 'number' && v >= 1 && v <= checkin.max) ? v : checkinState[fld.key];
          });
          return out;
        }

        // TODO: tune with me -- energy and sleep read up, soreness and stress read
        // down, each 1-5. All fours-and-threes lands mid-scale by design.
        function readinessScore(v) {
          const raw = (v.energy - 1) + (v.sleep - 1) + (checkin.max - v.soreness) + (checkin.max - v.stress);
          return Math.round(raw / ((checkin.max - 1) * 4) * 100);
        }

        // TODO: tune with me -- three rules today; each returns one change entry.
        function progressRules() {
          const items = [];
          const today = dayKey();
          const cv = checkinValues();
          const readiness = readinessScore(cv);
          const tr = trainStats();
          const ea = eatStats();
          const proteinTarget = eatData.macros.filter(function (m) { return m.key === 'p'; })[0].target;

          if (readiness < progressData.lowReadiness) {
            items.push({
              id: 'ease-load',
              title: "Eased today's training load",
              date: today,
              desc: 'Your latest check-in shows low readiness, so WRECK trims volume on the next hard session. Push again once readiness recovers.',
              basis: [
                'Readiness ' + readiness + ' / 100',
                'Energy ' + cv.energy + '/' + checkin.max + ', sleep ' + cv.sleep + '/' + checkin.max +
                  ', soreness ' + cv.soreness + '/' + checkin.max + ', stress ' + cv.stress + '/' + checkin.max,
                'Affects: Next resistance session volume'
              ]
            });
          }

          if (ea.days >= progressData.proteinMinDays && ea.avg < proteinTarget * progressData.proteinShortfall) {
            items.push({
              id: 'raise-protein',
              title: 'Raised protein focus',
              date: today,
              desc: 'Protein has been running well under target across the week, so WRECK pushes higher-protein options to the front of your food list.',
              basis: [
                'Average ' + Math.round(ea.avg) + ' g of ' + proteinTarget + ' g',
                'Logged on ' + ea.days + ' of ' + progressData.windowDays + ' days',
                'Affects: Food ordering and day plan'
              ]
            });
          }

          if (tr.week >= homeData.week.goal) {
            items.push({
              id: 'hold-progression',
              title: 'Held progression \u2014 on track',
              date: today,
              desc: 'You hit every session this week, so WRECK keeps the current progression rather than backing it off.',
              basis: [
                tr.week + ' of ' + homeData.week.goal + ' sessions this week',
                tr.allTime + ' sessions all-time',
                'Affects: Next week\u2019s load progression'
              ]
            });
          }

          return items;
        }

        function sparklineHtml(entries) {
          const pts = entries.slice(-14);
          if (pts.length < 2) return '';
          const w = 100, h = 30;
          const vals = pts.map(function (e) { return e.kg; });
          const lo = Math.min.apply(null, vals);
          const hi = Math.max.apply(null, vals);
          const span = hi - lo || 1;
          const coords = pts.map(function (e, i) {
            const x = pts.length === 1 ? w / 2 : (i / (pts.length - 1)) * w;
            const y = h - ((e.kg - lo) / span) * h;
            return x.toFixed(2) + ',' + y.toFixed(2);
          });
          const last = coords[coords.length - 1].split(',');
          return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
              '<polyline points="' + coords.join(' ') + '" vector-effect="non-scaling-stroke" />' +
              '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="1.6" vector-effect="non-scaling-stroke" />' +
            '</svg>';
        }

        function weightCardHtml() {
          const cfg = progressData.cards.weight;
          const entries = weightEntries();
          let head;
          if (!entries.length) {
            head = '<div class="prog-body">' + cfg.empty + '</div>';
          } else {
            const last = entries[entries.length - 1];
            const first = entries[0];
            const delta = last.kg - first.kg;
            const sign = delta > 0 ? '+' : '';
            head = '<div class="prog-big"><span class="prog-num">' + last.kg + '</span><span class="prog-unit">kg</span></div>' +
              '<div class="weight-delta">' + (entries.length > 1
                ? sign + (Math.round(delta * 10) / 10) + ' kg since ' + first.date
                : 'First entry logged ' + first.date) + '</div>' +
              sparklineHtml(entries);
          }
          return '<article class="card">' +
              '<div class="card-label">' + cfg.label + '</div>' + head +
              '<div class="weight-row">' +
                '<input id="weight-input" type="text" inputmode="decimal" placeholder="' + cfg.placeholder + '" aria-label="' + cfg.placeholder + '" />' +
                '<button class="btn-accent is-small" type="button" id="weight-log" data-cursor="Log" data-magnetic disabled>' + cfg.cta + '</button>' +
              '</div>' +
            '</article>';
        }

        function changeHtml(item, status) {
          const badge = status === 'accepted' ? 'Accepted' : status === 'dismissed' ? 'Dismissed' : 'Proposed';
          const cls = status === 'accepted' ? ' is-accepted' : status === 'dismissed' ? ' is-dismissed' : '';
          return '<div class="change">' +
              '<div class="change-head">' +
                '<h4 class="change-title">' + item.title + '</h4>' +
                '<span class="badge' + cls + '">' + badge + '</span>' +
                '<span class="change-date">' + item.date + '</span>' +
              '</div>' +
              '<div class="change-desc">' + item.desc + '</div>' +
              '<div class="change-basis">Based on</div>' +
              '<ul>' + item.basis.map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul>' +
              (status ? '' :
                '<div class="change-actions">' +
                  '<button class="btn-mini is-accept" type="button" data-decide="accepted" data-rule="' + item.id + '" data-cursor="Accept">Accept</button>' +
                  '<button class="btn-mini" type="button" data-decide="dismissed" data-rule="' + item.id + '" data-cursor="Dismiss">Dismiss</button>' +
                '</div>') +
            '</div>';
        }

        function buildProgressPanel() {
          const tr = trainStats();
          const ea = eatStats();
          const proteinTarget = eatData.macros.filter(function (m) { return m.key === 'p'; })[0].target;
          const c = progressData.cards;
          const decisions = readJson(progressData.decisionsKey, {}) || {};
          const items = progressRules();

          const changes = items.length
            ? '<div class="change-list">' + items.map(function (it) {
                return changeHtml(it, decisions[it.id] || null);
              }).join('') + '</div>'
            : '<article class="card"><div class="prog-body">' + progressData.emptyChange + '</div></article>';

          progressPanelEl.innerHTML =
            '<div class="panel-head">' +
              '<div class="panel-eyebrow">' + progressData.eyebrow + '</div>' +
              '<h2 class="panel-title">' + progressData.title + '</h2>' +
            '</div>' +
            '<div class="panel-rule"></div>' +

            '<div class="prog-grid">' +

              '<article class="card">' +
                '<div class="card-label">' + c.adherence.label + '</div>' +
                '<div class="prog-big"><span class="prog-num" data-count="' + tr.week + '">0</span>' +
                '<span class="prog-unit">' + c.adherence.unit + '</span></div>' +
                '<div class="macro-bar" style="--c: ' + c.adherence.color + '"><i data-fill="' +
                  Math.min(100, homeData.week.goal ? tr.week / homeData.week.goal * 100 : 0).toFixed(1) + '"></i></div>' +
                '<div class="prog-note">' + tr.allTime + ' sessions logged all-time.</div>' +
              '</article>' +

              '<article class="card">' +
                '<div class="card-label">' + c.protein.label + '</div>' +
                '<div class="prog-big"><span class="prog-num" data-count="' + Math.round(ea.avg) + '">0</span>' +
                '<span class="prog-unit">avg / ' + proteinTarget + ' g</span></div>' +
                '<div class="macro-bar" style="--c: ' + c.protein.color + '"><i data-fill="' +
                  Math.min(100, ea.avg / proteinTarget * 100).toFixed(1) + '"></i></div>' +
                '<div class="prog-note">' + (ea.days
                  ? 'Logged on ' + ea.days + ' of ' + progressData.windowDays + ' days.'
                  : c.protein.empty) + '</div>' +
              '</article>' +

              weightCardHtml() +

              '<article class="card">' +
                '<div class="card-label">' + c.consistency.label + '</div>' +
                '<div class="prog-body">You have logged ' + tr.allTime + ' session(s). ' + c.consistency.tail + '</div>' +
              '</article>' +

            '</div>' +

            '<h3 class="prog-section">' + progressData.changesTitle + '</h3>' +
            '<div class="panel-rule"></div>' +
            changes;

          refreshCards();
          refreshMagnets();
        }

        // mirrors playPanelReveal, kept separate so Home's stays untouched
        function playProgressReveal() {
          dropCardRects();
          progressPanelEl.querySelectorAll('[data-count]').forEach(function (el) {
            const to = Number(el.getAttribute('data-count')) || 0;
            if (!to) { el.textContent = '0'; return; }
            animateValue(function (t) { el.textContent = Math.round(to * t).toLocaleString(); }, 1200);
          });
          progressPanelEl.querySelectorAll('[data-fill]').forEach(function (el) {
            const to = el.getAttribute('data-fill');
            el.style.width = '0%';
            requestAnimationFrame(function () {
              requestAnimationFrame(function () { el.style.width = to + '%'; });
            });
          });
        }

        function logWeight(value) {
          const kg = Number(value);
          if (!(kg > 0) || kg > 400) return;
          const today = dayKey();
          const entries = weightEntries().filter(function (e) { return e.date !== today; });
          entries.push({ date: today, kg: Math.round(kg * 10) / 10 });
          entries.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
          writeJson(progressData.weightKey, entries);
          buildProgressPanel();
          playProgressReveal();
          toast('Logged ' + (Math.round(kg * 10) / 10) + ' kg for today');
        }

        progressPanelEl.addEventListener('click', function (e) {
          const decide = e.target.closest('[data-decide]');
          if (decide) {
            const status = decide.getAttribute('data-decide');
            const decisions = readJson(progressData.decisionsKey, {}) || {};
            decisions[decide.getAttribute('data-rule')] = status;
            writeJson(progressData.decisionsKey, decisions);
            buildProgressPanel();
            toast(status === 'accepted' ? 'Change accepted' : 'Change dismissed');
            return;
          }
          if (e.target.closest('#weight-log')) {
            const input = progressPanelEl.querySelector('#weight-input');
            if (input) logWeight(input.value);
          }
        });

        // decimals only, and the Log button stays dim until the value is usable
        progressPanelEl.addEventListener('input', function (e) {
          if (e.target.id !== 'weight-input') return;
          const cleaned = e.target.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');
          if (cleaned !== e.target.value) e.target.value = cleaned;
          const kg = Number(cleaned);
          const btn = progressPanelEl.querySelector('#weight-log');
          if (btn) btn.disabled = !(kg > 0 && kg <= 400);
        });

        progressPanelEl.addEventListener('keydown', function (e) {
          if (e.target.id === 'weight-input' && e.key === 'Enter') {
            e.preventDefault();
            logWeight(e.target.value);
          }
        });


        /* ---- COACH ---- */
        // All Coach copy and config. The monitor screen is the panel on a wide
        // viewport; below 900 the identical markup goes into #coach-panel.
        const coachData = {
          eyebrow: 'Coach',
          title: 'Talk it through',
          clear: 'Clear',
          placeholder: 'Ask about today, your targets, or a change',
          foot: 'The coach explains your plan from your real data. For medical or injury questions, please see a qualified professional.',
          offline: 'Offline mode',
          // the source-image rect of the bezel opening, per theme
          screen: {
            imageW: 1374,
            imageH: 1145,
            day:   { x: 298, y: 323, w: 784, h: 471 },
            night: { x: 325, y: 323, w: 722, h: 469 }
          },
          designW: 800,
          designH: 480,
          quick: [
            { id: 'tired',   label: "I'm tired today" },
            { id: 'missed',  label: 'I missed a workout' },
            { id: 'meal',    label: 'Change my meal' },
            { id: 'explain', label: "Explain today's workout" },
            { id: 'eat',     label: 'What should I eat' },
            { id: 'why',     label: 'Why did my plan change' }
          ],
          // one coaching cue per exercise name; anything unlisted falls back
          cues: {
            'Goblet Squat': 'Keep your chest tall and your elbows inside your knees.',
            'Romanian Deadlift': 'Hips back first, and stop where your hamstrings tighten.',
            'Dumbbell Bench Press': 'Lower under control; do not bounce off your chest.',
            'Dumbbell Row': 'Pull to the hip, not the armpit.',
            'Overhead Press': 'Squeeze your glutes so your lower back stays out of it.',
            'Reverse Lunge': 'Step back, not forward, to keep the front knee calm.',
            'Glute Bridge': 'Finish with the hips level, not arched.',
            'Incline Dumbbell Press': 'Low incline only; steep turns it into a shoulder press.',
            'One-arm Row': 'Keep your hips square through every rep.',
            'Lateral Raise': 'Light weight, no swing, stop at shoulder height.'
          },
          fallback: 'I can help with a few things from your own data:\n\n\u00b7 how you are feeling today and what that changes\n\u00b7 today\u2019s session and how to do each movement\n\u00b7 what is left on your calories and protein\n\u00b7 why your plan changed recently\n\nTap a quick action below, or ask in your own words.'
        };

        const coachScreenEl = document.getElementById('coach-screen');
        const coachFitEl = document.getElementById('coach-fit');
        const coachPanelEl = document.getElementById('coach-panel');

        function coachOnScreen() {
          return window.matchMedia('(min-width: 900px)').matches;
        }
        function coachHost() {
          return coachOnScreen() ? coachFitEl : coachPanelEl;
        }
        function coachStoreKey() { return 'pj-coach-' + dayKey(); }

        // [{ role: 'coach' | 'user', text, actions? }]
        let coachLog = (function () {
          const saved = readJson(coachStoreKey(), null);
          if (!Array.isArray(saved)) return [];
          return saved.filter(function (m) {
            return m && (m.role === 'coach' || m.role === 'user') && typeof m.text === 'string';
          });
        })();
        let coachBusy = false;
        let coachGreeted = false;
        let coachOffline = false;
        let coachMounted = null;

        function saveCoachLog() { writeJson(coachStoreKey(), coachLog.slice(-40)); }

        function todaySession() {
          return trainData.sessions[activeTab] || trainData.sessions[0];
        }
        function todayPlan() {
          return trainData.plans[todaySession().plan];
        }

        /* ---- the snapshot: the only user data that ever leaves the browser ---- */
        function coachSnapshot() {
          const tr = trainStats();
          const ea = eatStats();
          const cv = checkinValues();
          const totals = eatTotals();
          const targets = {};
          eatData.macros.forEach(function (m) { targets[m.key] = m.target; });
          const w = weightEntries();
          return {
            name: homeData.name,
            todaySession: todaySession().label,
            setsDone: doneCount(activeTab),
            setsTotal: TOTAL_SETS,
            sessionsThisWeek: tr.week,
            sessionsGoal: homeData.week.goal,
            sessionsAllTime: tr.allTime,
            calories: Math.round(totals.kcal),
            caloriesTarget: targets.kcal,
            protein: Math.round(totals.p),
            proteinTarget: targets.p,
            proteinWeekAvg: Math.round(ea.avg),
            daysLogged: ea.days,
            readiness: readinessScore(cv),
            checkin: cv,
            latestWeightKg: w.length ? w[w.length - 1].kg : null,
            recentChanges: progressRules().map(function (it) { return it.title; })
          };
        }

        /* ---- the offline engine: every answer comes from stored data ---- */
        function esc(t) {
          return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function remainingFoods() {
          const totals = eatTotals();
          const kcalLeft = eatData.macros[0].target - totals.kcal;
          const pTarget = eatData.macros.filter(function (m) { return m.key === 'p'; })[0].target;
          const pLeft = pTarget - totals.p;
          // highest protein per calorie first, then whatever still fits
          const picks = eatData.foods.slice().sort(function (a, b) {
            return (b.p / b.kcal) - (a.p / a.kcal);
          }).filter(function (fd) {
            return kcalLeft <= 0 || fd.kcal <= Math.max(160, kcalLeft);
          }).slice(0, 3);
          return { kcalLeft: Math.round(kcalLeft), pLeft: Math.round(pLeft), picks: picks };
        }

        function replyTired() {
          const cv = checkinValues();
          const r = readinessScore(cv);
          if (r < progressData.lowReadiness) {
            return {
              text: 'Readiness is ' + r + ' / 100 today, which is low. That usually means less volume, not a day off \u2014 keep the same movements and cut a set from each.\n\nI can ease today\u2019s session and record why.',
              actions: [{ kind: 'ease', label: 'Ease today\u2019s session' }]
            };
          }
          return {
            text: 'Readiness is ' + r + ' / 100, which is in normal range, so tiredness alone is not a reason to back off. Start the warm-up and judge it on the first working set \u2014 if that moves badly, cut a set.\n\nIf you want, update your check-in on Home and I will look again.',
            actions: [{ kind: 'travel', to: 'mercury', label: 'Open Home' }]
          };
        }

        function replyMissed() {
          const tr = trainStats();
          return {
            text: 'A missed day is not a backlog. Nothing needs making up \u2014 you just start the next one.\n\nNext up is ' + todaySession().label +
              '. You are at ' + tr.week + ' of ' + homeData.week.goal + ' sessions this week.',
            actions: [{ kind: 'travel', to: 'venus', label: 'Open Train' }]
          };
        }

        function replyEat() {
          const r = remainingFoods();
          const lines = r.picks.map(function (fd) {
            return '\u00b7 ' + fd.name + ' (' + fd.serving + ') \u2014 ' + fd.kcal + ' kcal, ' + fd.p + ' g protein';
          }).join('\n');
          const head = r.kcalLeft > 0
            ? 'You have ' + r.kcalLeft + ' kcal and ' + Math.max(0, r.pLeft) + ' g of protein left today.'
            : 'You are ' + Math.abs(r.kcalLeft) + ' kcal over target, so keep anything else small and protein-heavy.';
          return {
            text: head + '\n\nThese fit best:\n' + lines,
            actions: r.picks.map(function (fd) {
              return { kind: 'addFood', food: fd.id, meal: fd.meal, label: 'Add ' + fd.name };
            })
          };
        }

        function replyExplain() {
          const plan = todayPlan();
          const lines = plan.map(function (ex, i) {
            const name = exerciseAt(activeTab, i).name;
            return '\u00b7 ' + name + ' \u2014 ' + trainData.setsPerExercise + ' \u00d7 10-12. ' +
              (coachData.cues[name] || 'Control the lowering, then drive back up.');
          }).join('\n');
          return {
            text: todaySession().label + ' today. ' + doneCount(activeTab) + ' of ' + TOTAL_SETS + ' sets are done.\n\n' + lines,
            actions: [{ kind: 'travel', to: 'venus', label: 'Open Train' }]
          };
        }

        function replyWhy() {
          const items = progressRules();
          if (!items.length) {
            return { text: 'Nothing has changed yet. Log a check-in, a session or a meal and I will explain every adjustment here.', actions: [] };
          }
          const lines = items.map(function (it) {
            return '\u00b7 ' + it.title + ' \u2014 ' + it.desc;
          }).join('\n\n');
          return {
            text: 'Here is what WRECK changed recently and why:\n\n' + lines,
            actions: [{ kind: 'travel', to: 'mars', label: 'Open Progress' }]
          };
        }

        function replyWeight() {
          const w = weightEntries();
          if (!w.length) {
            return { text: 'No weight logged yet. Add today\u2019s on Progress and I can track the trend from there \u2014 one reading means nothing, two weeks of them means a lot.',
                     actions: [{ kind: 'travel', to: 'mars', label: 'Open Progress' }] };
          }
          const last = w[w.length - 1], first = w[0];
          const d = Math.round((last.kg - first.kg) * 10) / 10;
          return {
            text: 'Latest is ' + last.kg + ' kg' + (w.length > 1
              ? ', ' + (d > 0 ? '+' : '') + d + ' kg since ' + first.date + ' across ' + w.length + ' entries.'
              : ', your first entry.') + '\n\nJudge it on the trend over weeks, not day to day.',
            actions: [{ kind: 'travel', to: 'mars', label: 'Open Progress' }]
          };
        }

        // keyword intent matching -- deliberately simple and offline
        function coachReply(text) {
          const q = String(text || '').toLowerCase();
          const has = function () {
            for (let i = 0; i < arguments.length; i++) if (q.indexOf(arguments[i]) > -1) return true;
            return false;
          };
          if (has('tired', 'sore', 'exhaust', 'sleep', 'readiness', 'drained')) return replyTired();
          if (has('missed', 'skip', 'behind', 'backlog')) return replyMissed();
          if (has('meal', 'food', 'eat', 'protein', 'calorie', 'kcal', 'hungry', 'dinner', 'lunch', 'breakfast')) return replyEat();
          if (has('workout', 'exercise', 'session', 'train', 'lift', 'set', 'rep')) return replyExplain();
          if (has('weight', 'weigh', 'scale', 'kg')) return replyWeight();
          if (has('why', 'change', 'changed', 'adjust', 'plan')) return replyWhy();
          return { text: coachData.fallback, actions: [] };
        }

        function quickReply(id) {
          if (id === 'tired') return replyTired();
          if (id === 'missed') return replyMissed();
          if (id === 'meal' || id === 'eat') return replyEat();
          if (id === 'explain') return replyExplain();
          if (id === 'why') return replyWhy();
          return coachReply(id);
        }

        /* ---- rendering ---- */
        function bubbleHtml(m, i) {
          const acts = (m.actions || []).map(function (a, k) {
            return '<button type="button" data-act="' + i + ':' + k + '"' +
              (a.done ? ' disabled' : '') + '>' + esc(a.done ? a.doneLabel || a.label : a.label) + '</button>';
          }).join('');
          return '<div class="bubble is-' + m.role + '" data-i="' + i + '">' +
            esc(m.text).replace(/\n/g, '<br>') +
            (acts ? '<div class="bubble-actions">' + acts + '</div>' : '') +
            '</div>';
        }

        function coachUiHtml() {
          const quick = coachData.quick.map(function (q) {
            return '<button class="qa" type="button" data-quick="' + q.id + '" data-cursor="Ask">' + q.label + '</button>';
          }).join('');
          return '<div class="coach-ui">' +
              '<div class="coach-head">' +
                '<div>' +
                  '<div class="coach-eyebrow">' + coachData.eyebrow + '</div>' +
                  '<h2 class="coach-title">' + coachData.title + '</h2>' +
                '</div>' +
                '<button class="coach-clear" type="button" data-coach-clear>' + coachData.clear + '</button>' +
              '</div>' +
              '<div class="coach-rule"></div>' +
              '<div class="coach-actions">' + quick + '</div>' +
              '<div class="coach-log" id="coach-log">' + coachLog.map(bubbleHtml).join('') + '</div>' +
              '<form class="coach-form" data-coach-form>' +
                '<input type="text" autocomplete="off" placeholder="' + coachData.placeholder + '" aria-label="' + coachData.placeholder + '" />' +
                '<button class="coach-send" type="submit" data-cursor="Send" disabled>\u2192</button>' +
              '</form>' +
              '<div class="coach-foot">' + coachData.foot + '</div>' +
              '<div class="coach-offline' + (coachOffline ? ' is-on' : '') + '">' + coachData.offline + '</div>' +
            '</div>';
        }

        function coachLogEl() {
          const host = coachHost();
          return host ? host.querySelector('#coach-log') : null;
        }
        function scrollCoach() {
          const el = coachLogEl();
          if (el) el.scrollTop = el.scrollHeight;
        }

        function renderCoachLog() {
          const el = coachLogEl();
          if (!el) return;
          el.innerHTML = coachLog.map(bubbleHtml).join('');
          scrollCoach();
        }

        // Mounts into whichever host the viewport calls for, moving the chat
        // between the monitor and the mobile panel on a resize across 900.
        function mountCoach() {
          const host = coachHost();
          if (!host) return;
          const mode = coachOnScreen() ? 'screen' : 'panel';
          if (coachMounted !== mode || !host.querySelector('.coach-ui')) {
            if (coachFitEl) coachFitEl.innerHTML = '';
            if (coachPanelEl) coachPanelEl.innerHTML = '';
            host.innerHTML = coachUiHtml();
            coachMounted = mode;
            if (mode === 'panel') host.querySelector('.coach-ui').classList.add('is-in');
          }
          layoutCoachScreen();
          if (!coachLog.length) greetCoach();
          else scrollCoach();
          refreshCards();
          refreshMagnets();
        }

        /* ---- the screen rect, derived from the cover transform ---- */
        let screenMix = document.documentElement.dataset.theme === 'light' ? 0 : 1;

        function screenRect() {
          const cfg = coachData.screen;
          const vw = window.innerWidth, vh = window.innerHeight;
          const scale = Math.max(vw / cfg.imageW, vh / cfg.imageH);
          const offX = (vw - cfg.imageW * scale) / 2;
          const offY = (vh - cfg.imageH * scale) / 2;
          const d = cfg.day, nn = cfg.night, t = screenMix;
          const x = d.x + (nn.x - d.x) * t;
          const y = d.y + (nn.y - d.y) * t;
          const w = d.w + (nn.w - d.w) * t;
          const h = d.h + (nn.h - d.h) * t;
          return { left: offX + x * scale, top: offY + y * scale, width: w * scale, height: h * scale };
        }

        function layoutCoachScreen() {
          if (!coachScreenEl || !coachOnScreen()) return;
          const r = screenRect();
          coachScreenEl.style.left = r.left.toFixed(1) + 'px';
          coachScreenEl.style.top = r.top.toFixed(1) + 'px';
          coachScreenEl.style.width = r.width.toFixed(1) + 'px';
          coachScreenEl.style.height = r.height.toFixed(1) + 'px';
          // fit the fixed design surface inside whatever the bezel gives us
          const k = Math.min(r.width / coachData.designW, r.height / coachData.designH);
          coachFitEl.style.transform =
            'translate(' + ((r.width - coachData.designW * k) / 2).toFixed(1) + 'px,' +
            ((r.height - coachData.designH * k) / 2).toFixed(1) + 'px) scale(' + k.toFixed(4) + ')';
        }

        window.addEventListener('resize', function () {
          layoutCoachScreen();
          if (current === 'progress') mountCoach();
        });

        /* ---- power on / off ---- */
        function powerOnCoach() {
          dropCardRects();
          if (!coachOnScreen()) { mountCoach(); return; }
          mountCoach();
          coachScreenEl.classList.remove('is-booting');
          void coachScreenEl.offsetWidth;
          coachScreenEl.classList.add('is-on', 'is-booting');
          const ui = coachFitEl.querySelector('.coach-ui');
          if (ui) setTimeout(function () { ui.classList.add('is-in'); }, 260);
        }

        function powerOffCoach() {
          if (!coachScreenEl) return;
          coachScreenEl.classList.remove('is-on', 'is-booting');
          const ui = coachFitEl && coachFitEl.querySelector('.coach-ui');
          if (ui) ui.classList.remove('is-in');
        }

        /* ---- messages ---- */
        function typeOut(el, text) {
          if (reducedMotion) { el.innerHTML = esc(text).replace(/\n/g, '<br>'); scrollCoach(); return Promise.resolve(); }
          const chars = Array.from(text);
          return animateValue(function (t) {
            const upto = Math.ceil(chars.length * t);
            el.innerHTML = esc(chars.slice(0, upto).join('')).replace(/\n/g, '<br>');
            scrollCoach();
          }, Math.min(1400, 260 + chars.length * 7));
        }

        async function pushCoach(reply) {
          const el = coachLogEl();
          if (!el) {
            coachLog.push({ role: 'coach', text: reply.text, actions: reply.actions || [] });
            saveCoachLog();
            return;
          }
          // typing indicator first, then the text types in place
          const wrap = document.createElement('div');
          wrap.className = 'bubble is-coach';
          wrap.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
          el.appendChild(wrap);
          scrollCoach();
          await new Promise(function (r) { setTimeout(r, reducedMotion ? 0 : 420); });
          wrap.innerHTML = '';
          await typeOut(wrap, reply.text);
          coachLog.push({ role: 'coach', text: reply.text, actions: reply.actions || [] });
          saveCoachLog();
          renderCoachLog();
        }

        function pushUser(text) {
          coachLog.push({ role: 'user', text: text });
          saveCoachLog();
          renderCoachLog();
        }

        async function greetCoach() {
          // the push is async, so the flag has to flip before the first await or a
          // second mount slips in and greets again
          if (coachGreeted || coachLog.length) return;
          coachGreeted = true;
          await pushCoach({
            text: 'Hi ' + homeData.name + '. I am your WRECK coach. Today\u2019s session is ' + todaySession().label +
              '. Ask me anything about your plan, or tap a quick action below.',
            actions: []
          });
        }

        /* ---- the live coach, with the offline engine as the fallback ---- */
        // Probed once, lazily. A server with no GEMINI_API_KEY answers the POST
        // with a 503, and the browser logs every non-2xx itself, so ask health
        // first and simply never post when the key is missing.
        let coachServer = null;
        async function coachServerReady() {
          if (coachServer !== null) return coachServer;
          const ctrl = new AbortController();
          const timer = setTimeout(function () { ctrl.abort(); }, 2500);
          try {
            const res = await fetch('/api/coach/health', { signal: ctrl.signal });
            const data = res.ok ? await res.json() : null;
            coachServer = !!(data && data.ok && data.configured);
          } catch (e) {
            coachServer = false;
          } finally {
            clearTimeout(timer);
          }
          return coachServer;
        }

        async function askServer(text) {
          const ctrl = new AbortController();
          const timer = setTimeout(function () { ctrl.abort(); }, 8000);
          try {
            const res = await fetch('/api/coach', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: text,
                history: coachLog.slice(-10).map(function (m) { return { role: m.role, text: m.text }; }),
                snapshot: coachSnapshot()
              }),
              signal: ctrl.signal
            });
            if (!res.ok) return null;
            const data = await res.json();
            return data && typeof data.reply === 'string' && data.reply.trim() ? data.reply.trim() : null;
          } catch (e) {
            return null;
          } finally {
            clearTimeout(timer);
          }
        }

        function setOffline(on) {
          if (coachOffline === on) return;
          coachOffline = on;
          const host = coachHost();
          const dot = host && host.querySelector('.coach-offline');
          if (dot) dot.classList.toggle('is-on', on);
        }

        async function sendCoach(text, quickId) {
          if (coachBusy) return;
          const clean = String(text || '').trim();
          if (!clean) return;
          coachBusy = true;
          pushUser(clean);
          try {
            // Quick actions stay deterministic; only free text asks the server.
            if (quickId) {
              await pushCoach(quickReply(quickId));
            } else {
              const live = (await coachServerReady()) ? await askServer(clean) : null;
              setOffline(!live);
              await pushCoach(live ? { text: live, actions: [] } : coachReply(clean));
            }
          } finally {
            coachBusy = false;
          }
        }

        /* ---- inline actions ---- */
        function runCoachAction(mi, ai) {
          const msg = coachLog[mi];
          const act = msg && msg.actions && msg.actions[ai];
          if (!act || act.done) return;

          if (act.kind === 'travel') { travel(act.to); return; }

          if (act.kind === 'addFood') {
            addFood(act.food, act.meal, 1);
            act.done = true;
            act.doneLabel = 'Added';
          } else if (act.kind === 'ease') {
            const decisions = readJson(progressData.decisionsKey, {}) || {};
            decisions['ease-load'] = 'accepted';
            writeJson(progressData.decisionsKey, decisions);
            buildProgressPanel();
            act.done = true;
            act.doneLabel = 'Eased';
            toast('Today\u2019s session eased');
          }
          saveCoachLog();
          renderCoachLog();
        }

        function coachDelegate(root) {
          root.addEventListener('click', function (e) {
            const quick = e.target.closest('[data-quick]');
            if (quick) {
              const id = quick.getAttribute('data-quick');
              const label = coachData.quick.filter(function (q) { return q.id === id; })[0];
              sendCoach(label ? label.label : id, id);
              return;
            }
            const act = e.target.closest('[data-act]');
            if (act) {
              const parts = act.getAttribute('data-act').split(':');
              runCoachAction(Number(parts[0]), Number(parts[1]));
              return;
            }
            if (e.target.closest('[data-coach-clear]')) {
              coachLog = [];
              coachGreeted = false;
              saveCoachLog();
              renderCoachLog();
              greetCoach();
            }
          });

          root.addEventListener('input', function (e) {
            if (e.target.tagName !== 'INPUT') return;
            const form = e.target.closest('[data-coach-form]');
            if (!form) return;
            form.querySelector('.coach-send').disabled = !e.target.value.trim();
          });

          root.addEventListener('submit', function (e) {
            const form = e.target.closest('[data-coach-form]');
            if (!form) return;
            e.preventDefault();
            const input = form.querySelector('input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            form.querySelector('.coach-send').disabled = true;
            sendCoach(text, null);
          });
        }

        coachDelegate(coachScreenEl);
        coachDelegate(coachPanelEl);

        /* ---- SCENE: parallax, night life, magnets ---- */
        /* The grass sways on a CSS keyframe of its own. The cursor only drives
           parallax here -- it never deforms the grass. */
        const grassEl = document.getElementById('home-grass');
        // which layer the cursor parallaxes, per section; a section that is not
        // listed simply has no parallax and the loop never starts for it
        const sceneBases = {
          mercury: document.getElementById('home-base'),
          venus: document.getElementById('train-base'),
          earth: document.getElementById('eat-base'),
          mars: document.getElementById('progress-base'),
          progress: document.getElementById('coach-base')
        };
        const reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

        let baseX = 0, baseY = 0, grassX = 0, grassY = 0;
        let aimX = 0, aimY = 0;
        let introRect = null;
        let homeRaf = 0;

        // the parallax loop parks itself when settled; moving the mouse wakes it
        function wakeScene() {
          startScene();
        }

        function seedNightLife() {
          let html = '';
          for (let i = 0; i < 42; i++) {
            html += '<span class="star" style="left:' + (Math.random() * 100).toFixed(2) + '%;top:' +
              (Math.random() * 45).toFixed(2) + '%;animation-duration:' + (2.5 + Math.random() * 4).toFixed(2) +
              's;animation-delay:-' + (Math.random() * 5).toFixed(2) + 's"></span>';
          }
          document.getElementById('home-stars').innerHTML = html;

          html = '';
          for (let i = 0; i < 16; i++) {
            const drift = 7 + Math.random() * 8;
            const glow = 2.5 + Math.random() * 3;
            html += '<span class="fly" style="left:' + (6 + Math.random() * 88).toFixed(2) + '%;top:' +
              (64 + Math.random() * 28).toFixed(2) + '%;--dx:' + (Math.random() * 70 - 35).toFixed(0) + 'px;--dy:' +
              (Math.random() * 40 - 20).toFixed(0) + 'px;animation-duration:' + drift.toFixed(2) + 's,' + glow.toFixed(2) +
              's;animation-delay:-' + (Math.random() * drift).toFixed(2) + 's,-' + (Math.random() * glow).toFixed(2) + 's"></span>';
          }
          document.getElementById('home-flies').innerHTML = html;
        }

        let magnets = [];
        function refreshMagnets() {
          magnets = [].slice.call(document.querySelectorAll('[data-magnetic]')).map(function(el) {
            return { el: el, x: 0, y: 0, rect: null };
          });
        }
        window.addEventListener('resize', function() {
          magnets.forEach(function(m) { m.rect = null; });
        });

        function sceneFrame() {
          homeRaf = 0;

          const baseLayer = sceneBases[current];
          const hasGrass = current === 'mercury';

          // on Home the grass layer travels further than the sky, which reads as
          // depth; Train has one layer, so it moves at the base rate alone
          aimX = -(cursorX / window.innerWidth - 0.5) * 2;
          aimY = -(cursorY / window.innerHeight - 0.5) * 2;
          baseX += (aimX * 12 - baseX) * 0.06;
          baseY += (aimY * 12 - baseY) * 0.06;

          if (baseLayer) {
            baseLayer.style.transform = 'translate3d(' + baseX.toFixed(2) + 'px,' + baseY.toFixed(2) + 'px,0)';
          }
          if (hasGrass) {
            grassX += (aimX * 20 - grassX) * 0.06;
            grassY += (aimY * 20 - grassY) * 0.06;
            grassEl.style.transform = 'translate3d(' + grassX.toFixed(2) + 'px,' + grassY.toFixed(2) + 'px,0)';
          }

          let pulling = false;
          for (let i = 0; i < magnets.length; i++) {
            const m = magnets[i];
            if (!m.rect) m.rect = m.el.getBoundingClientRect();
            const cx = m.rect.left + m.rect.width / 2;
            const cy = m.rect.top + m.rect.height / 2;
            const dx = cursorX - cx;
            const dy = cursorY - cy;
            const dist = Math.hypot(dx, dy);
            const pull = dist < 60 ? 1 - dist / 60 : 0;
            const tx = Math.max(-6, Math.min(6, dx * pull * 0.35));
            const ty = Math.max(-6, Math.min(6, dy * pull * 0.35));
            m.x += (tx - m.x) * 0.2;
            m.y += (ty - m.y) * 0.2;
            if (Math.abs(m.x) > 0.05 || Math.abs(m.y) > 0.05) {
              m.el.style.transform = 'translate3d(' + m.x.toFixed(2) + 'px,' + m.y.toFixed(2) + 'px,0)';
              pulling = true;
            } else if (m.el.style.transform) {
              m.el.style.transform = '';
            }
          }

          let tilting = false;
          for (let i = 0; i < panelCards.length; i++) {
            const c = panelCards[i];
            if (!c.rect) c.rect = c.el.getBoundingClientRect();
            const r = c.rect;
            if (!r.width) continue;
            const nx = (cursorX - r.left) / r.width;
            const ny = (cursorY - r.top) / r.height;
            const inside = nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1;
            if (inside !== c.lit) {
              c.lit = inside;
              c.el.classList.toggle('is-lit', inside);
            }
            if (inside) {
              c.el.style.setProperty('--mx', (nx * 100).toFixed(1) + '%');
              c.el.style.setProperty('--my', (ny * 100).toFixed(1) + '%');
            }
            // typing into a tilted card is miserable, so a card holding focus stays flat
            const typing = c.el.contains(document.activeElement);
            const aimRY = (inside && !reducedMotion && !typing) ? (nx - 0.5) * 6 : 0;
            const aimRX = (inside && !reducedMotion && !typing) ? (0.5 - ny) * 6 : 0;
            c.ry += (aimRY - c.ry) * 0.12;
            c.rx += (aimRX - c.rx) * 0.12;
            if (Math.abs(c.rx) > 0.02 || Math.abs(c.ry) > 0.02) {
              c.el.style.transform = 'perspective(760px) rotateX(' + c.rx.toFixed(3) + 'deg) rotateY(' + c.ry.toFixed(3) + 'deg)';
              tilting = true;
            } else if (c.el.style.transform) {
              c.el.style.transform = '';
            }
          }

          // Nothing left to move: drop the loop entirely. wakeScene restarts it.
          const settled = !pulling && !tilting &&
            Math.abs(aimX * 12 - baseX) < 0.1 && Math.abs(aimY * 12 - baseY) < 0.1 &&
            (!hasGrass || (Math.abs(aimX * 20 - grassX) < 0.1 && Math.abs(aimY * 20 - grassY) < 0.1));
          if (settled) return;

          homeRaf = requestAnimationFrame(sceneFrame);
        }

        function startScene() {
          if (homeRaf || document.hidden) return;
          homeRaf = requestAnimationFrame(sceneFrame);
        }

        function stopScene() {
          if (homeRaf) { cancelAnimationFrame(homeRaf); homeRaf = 0; }
        }

        document.addEventListener('visibilitychange', function() {
          if (document.hidden) stopScene();
          else startScene();
        });

        seedNightLife();

        /* 12. BOOT ORDER */
        // a finished session is stored per day, so Home's weekly count survives a reload
        homeData.week.value = Math.min(homeData.week.goal,
          homeData.week.value + trainTabs.filter(function (t) { return t.done; }).length);
        // a logged day is stored per date, so Home's calorie card survives a reload
        homeData.calories.value = Math.round(eatTotals().kcal);
        buildPanel();
        buildTrainPanel();
        buildEatPanel();
        buildProgressPanel();
        resizeCanvas();
        render();
        requestAnimationFrame(draw);
        requestAnimationFrame(cursorLoop);
        runPreloader();
      })();
    </script>
  </body>
</html>
