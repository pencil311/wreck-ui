    <script>
      (function() {
        const HOME_DAY = '/assets/home-day.png';
        const HOME_NIGHT = '/assets/home-night.png';
        const TRAIN_DAY = '/assets/train-day.png';
        const TRAIN_NIGHT = '/assets/train-night.png';
        const EAT_DAY = '/assets/eat-day.png';
        const EAT_NIGHT = '/assets/eat-night.png';
        const PROGRESS_DAY = '/assets/progress-day.png';
        const PROGRESS_NIGHT = '/assets/progress-night.png';
        const COACH_DAY = '/assets/coach-day.png';
        const COACH_NIGHT = '/assets/coach-night.png';

        function homeImage() {
          return document.documentElement.dataset.theme === 'light' ? HOME_DAY : HOME_NIGHT;
        }
        function trainImage() {
          return document.documentElement.dataset.theme === 'light' ? TRAIN_DAY : TRAIN_NIGHT;
        }
        function eatImage() {
          return document.documentElement.dataset.theme === 'light' ? EAT_DAY : EAT_NIGHT;
        }
        function progressImage() {
          return document.documentElement.dataset.theme === 'light' ? PROGRESS_DAY : PROGRESS_NIGHT;
        }
        function coachImage() {
          return document.documentElement.dataset.theme === 'light' ? COACH_DAY : COACH_NIGHT;
        }

        // Destination chain. `arrival` is the still shown in the rounded window
        // when travelling TO this section; `next` closes the loop back to Home.
        // Every arrival is a themed image now, so the getters re-read per render.
        const states = {
          mercury:  { label: 'Home',     next: 'venus',    arrival: { type: 'image', get src() { return homeImage(); } },  background: 'mercury-background' },
          venus:    { label: 'Train',    next: 'earth',    arrival: { type: 'image', get src() { return trainImage(); } }, background: 'venus-background' },
          earth:    { label: 'Eat',      next: 'mars',     arrival: { type: 'image', get src() { return eatImage(); } },   background: 'earth-background' },
          mars:     { label: 'Progress', next: 'progress', arrival: { type: 'image', get src() { return progressImage(); } }, background: 'mars-background' },
          progress: { label: 'Coach',    next: 'settings', arrival: { type: 'image', get src() { return coachImage(); } }, background: 'coach-background' },
          // TODO: replace with section art
          settings: { label: 'Settings', next: 'signout',  arrival: { type: 'image', get src() { return homeImage(); } },  background: 'placeholder-background' },
          // TODO: replace with section art
          signout:  { label: 'Sign Out', next: 'mercury',  arrival: { type: 'image', get src() { return homeImage(); } },  background: 'placeholder-background' }
        };

        // section stills sit behind hidden backgrounds, so warm them at boot
        [TRAIN_DAY, TRAIN_NIGHT, EAT_DAY, EAT_NIGHT, PROGRESS_DAY, PROGRESS_NIGHT, COACH_DAY, COACH_NIGHT]
          .forEach(function(src) { new Image().src = src; });

        const order = Object.keys(states);
        order.forEach(function(key, i) { states[key].number = '[0' + (i + 1) + ']'; });

        let current = 'mercury';
        let busy = false;
        let isFirstRender = true;
        let hasFrozenScene = false;
        let transitionActive = false;
        let activeTransitionMedia = null;
        let expansion = 0;
        let maskScale = 0;
        let canvasOpacity = 1;

        let targetX = 0;
        let targetY = 0;
        let rotX = 0;
        let rotY = 0;
        let lastTime = performance.now();

        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;
        let orbitX = cursorX;
        let orbitY = cursorY;
        let cursorVisible = false;

        const experienceEl = document.querySelector('.experience');
        const preloaderEl = document.getElementById('preloader');
        const preloaderVideo = document.getElementById('preloader-video');
        const preloaderCountEl = document.getElementById('preloader-count');
        const preloaderValEl = document.getElementById('preloader-value');

        const sceneCanvas = document.getElementById('scene-canvas');
        const sceneCtx = sceneCanvas.getContext('2d');
        const portalCanvas = document.getElementById('portal-canvas');
        const portalCtx = portalCanvas.getContext('2d');

        const portalBtn = document.getElementById('portal');
        const portalImage = document.getElementById('portal-image');
        const nextName = document.getElementById('next-name');
        const nextNumber = document.getElementById('next-number');

        const planetTitle = document.getElementById('planet-title');
        const planetListEl = document.querySelector('.planet-list');

        const transitionImage = document.getElementById('transition-image');
        const cursorEl = document.querySelector('.custom-cursor');
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOrbit = document.querySelector('.cursor-orbit');

        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animateValue(setter, duration) {
          return new Promise(function(resolve) {
            const start = performance.now();
            function tick(now) {
              const elapsed = now - start;
              const progress = Math.min(1, elapsed / duration);
              const val = easeInOutCubic(progress);
              setter(val);
              if (progress < 1) {
                requestAnimationFrame(tick);
              } else {
                setter(1);
                resolve();
              }
            }
            requestAnimationFrame(tick);
          });
        }

        function resizeCanvas() {
          const d = Math.min(window.devicePixelRatio || 1, 2);
          portalCanvas.width = window.innerWidth * d;
          portalCanvas.height = window.innerHeight * d;
          portalCanvas.style.width = window.innerWidth + 'px';
          portalCanvas.style.height = window.innerHeight + 'px';
          portalCtx.setTransform(d, 0, 0, d, 0, 0);

          if (!hasFrozenScene) {
            sceneCanvas.width = window.innerWidth * d;
            sceneCanvas.height = window.innerHeight * d;
            sceneCtx.setTransform(d, 0, 0, d, 0, 0);
          }
        }
        window.addEventListener('resize', resizeCanvas);

        function drawCover(ctx, media) {
          if (!media) return;
          const mw = media.videoWidth || media.naturalWidth || media.width || 0;
          const mh = media.videoHeight || media.naturalHeight || media.height || 0;
          if (!mw || !mh) return;
          const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
          const w = mw * scale;
          const h = mh * scale;
          const x = (window.innerWidth - w) / 2;
          const y = (window.innerHeight - h) / 2;
          ctx.drawImage(media, x, y, w, h);
        }

        function drawShade(ctx) {
          const startY = window.innerHeight * 0.52;
          const h = window.innerHeight - startY;
          const grad = ctx.createLinearGradient(0, startY, 0, window.innerHeight);
          grad.addColorStop(0, 'rgba(0,0,0,0)');
          grad.addColorStop(1, 'rgba(0,0,0,0.88)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, startY, window.innerWidth, h);
        }

        function render() {
          const state = states[current];
          const nextState = states[state.next];
          experienceEl.dataset.planet = current;
          planetTitle.textContent = state.label.toUpperCase();
          nextName.textContent = nextState.label;
          nextNumber.textContent = nextState.number;
          portalBtn.setAttribute('aria-label', 'Go to ' + nextState.label);

          planetListEl.innerHTML = order.map(function(key) {
            const active = key === current;
            return '<button type="button" class="planet-item' + (active ? ' active' : '') + '" data-planet="' + key + '">' + states[key].label + '</button>';
          }).join('');

          if (!isFirstRender) {
            planetListEl.classList.remove('is-switching');
            void planetListEl.offsetWidth;
            planetListEl.classList.add('is-switching');
          } else {
            isFirstRender = false;
          }

          document.querySelectorAll('.background').forEach(function(bg) {
            bg.classList.toggle('is-visible', bg.id === state.background);
          });

          document.querySelectorAll('.section-panel').forEach(function(p) {
            // Coach only uses its side panel on narrow viewports; on a wide one the
            // monitor is the panel, and an .is-active here would trip the :has()
            // rules that hide the left rail.
            const on = p.dataset.section === current &&
              !(p.id === 'coach-panel' && coachOnScreen());
            p.classList.toggle('is-active', on);
          });

          // Progress reads Train, Eat and the check-in, any of which may have
          // changed since the last visit, so it is rebuilt on every arrival
          if (current === 'mars') buildProgressPanel();
          if (current === 'progress') mountCoach();
          else powerOffCoach();

          startScene();

          syncPortalPreview();
        }

        // Split out of render() so a theme toggle can re-read the arrival getter
        // without also replaying the left-hand list's switch animation.
        function syncPortalPreview() {
          const preview = states[states[current].next].arrival;
          if (portalImage.getAttribute('src') !== preview.src) {
            portalImage.src = preview.src;
          }
        }

        window.addEventListener('pointermove', function(e) {
          if (e.pointerType === 'touch') return;
          if (busy) return;
          targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
          targetX = (e.clientY / window.innerHeight - 0.5) * -33;
        });
        window.addEventListener('pointerleave', function() {
          targetX = 0;
          targetY = 0;
        });

        function draw(now) {
          const dt = Math.min(40, now - lastTime);
          lastTime = now;

          rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
          rotY += (targetY - rotY) * Math.min(1, dt * 0.009);

          portalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          if (hasFrozenScene) {
            portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
            drawShade(portalCtx);
          }

          const rect = introRect || portalBtn.getBoundingClientRect();
          const rectCx = rect.left + rect.width / 2;
          const rectCy = rect.top + rect.height / 2;
          const e = expansion;

          const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
          const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;
          const baseW = rect.width + (window.innerWidth - rect.width) * e;
          const baseH = rect.height + (window.innerHeight - rect.height) * e;
          const scale = e ? 1 : maskScale;
          const w = baseW * scale;
          const h = baseH * scale;
          const r = Math.min(60 * (1 - e) * scale, Math.min(w / 2, h / 2));
          const rx = rotX * (1 - e);
          const ry = rotY * (1 - e);

          if (w > 1 && h > 1) {
            const rad = Math.max(0, r);
            const arcs = [
              [w / 2 - rad, -h / 2 + rad, -Math.PI / 2, 0],
              [w / 2 - rad,  h / 2 - rad, 0, Math.PI / 2],
              [-w / 2 + rad, h / 2 - rad, Math.PI / 2, Math.PI],
              [-w / 2 + rad, -h / 2 + rad, Math.PI, Math.PI * 1.5]
            ];

            const points = [];
            for (let i = 0; i < 4; i++) {
              const acx = arcs[i][0];
              const acy = arcs[i][1];
              const startA = arcs[i][2];
              const endA = arcs[i][3];
              for (let s = 0; s <= 10; s++) {
                const a = startA + (endA - startA) * (s / 10);
                points.push({
                  x: acx + Math.cos(a) * rad,
                  y: acy + Math.sin(a) * rad
                });
              }
            }

            const ax = rx * Math.PI / 180;
            const ay = ry * Math.PI / 180;
            const cosAy = Math.cos(ay);
            const sinAy = Math.sin(ay);
            const cosAx = Math.cos(ax);
            const sinAx = Math.sin(ax);

            portalCtx.save();
            portalCtx.globalAlpha = canvasOpacity;
            portalCtx.beginPath();
            for (let i = 0; i < points.length; i++) {
              const px0 = points[i].x;
              const py0 = points[i].y;
              const xx = px0 * cosAy;
              const yy = py0 * cosAx;
              const z = px0 * sinAy - py0 * sinAx;
              const p = 850 / (850 + z);
              const sx = cx + xx * p;
              const sy = cy + yy * p;
              if (i === 0) portalCtx.moveTo(sx, sy);
              else portalCtx.lineTo(sx, sy);
            }
            portalCtx.closePath();
            portalCtx.clip();

            portalCtx.fillStyle = '#030303';
            portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // every arrival is a still now, so the window always shows the <img>
            drawCover(portalCtx, activeTransitionMedia || portalImage);

            if (transitionActive) {
              drawShade(portalCtx);
            }
            portalCtx.restore();
          }

          requestAnimationFrame(draw);
        }

        window.addEventListener('pointermove', function(e) {
          if (e.pointerType === 'touch') return;
          cursorX = e.clientX;
          cursorY = e.clientY;
          if (!cursorVisible) {
            cursorVisible = true;
            cursorEl.classList.add('is-visible');
          }
          wakeScene();
        });

        document.addEventListener('mouseleave', function() {
          cursorVisible = false;
          cursorEl.classList.remove('is-visible');
        });

        const cursorLabel = document.querySelector('.cursor-label');

        document.addEventListener('pointerover', function(e) {
          const el = e.target.closest && e.target.closest('[data-cursor]');
          if (!el) return;
          cursorLabel.textContent = el.getAttribute('data-cursor');
          cursorEl.classList.add('is-enter');
        });
        document.addEventListener('pointerout', function(e) {
          const el = e.target.closest && e.target.closest('[data-cursor]');
          if (el && !el.contains(e.relatedTarget)) cursorEl.classList.remove('is-enter');
        });

        function cursorLoop() {
          orbitX += (cursorX - orbitX) * 0.2;
          orbitY += (cursorY - orbitY) * 0.2;

          cursorEl.style.transform = 'translate3d(' + orbitX + 'px, ' + orbitY + 'px, 0)';
          cursorDot.style.transform = 'translate3d(' + (cursorX - orbitX) + 'px, ' + (cursorY - orbitY) + 'px, 0) translate(-50%, -50%)';

          requestAnimationFrame(cursorLoop);
        }

        function revealMask() {
          experienceEl.classList.remove('mask-revealing');
          void experienceEl.offsetWidth;
          experienceEl.classList.add('mask-revealing');
          maskScale = 0;
          return animateValue(function(v) { maskScale = v; }, 1050);
        }

        function revealPlanetContent() {
          experienceEl.classList.remove('content-revealing');
          void experienceEl.offsetWidth;
          experienceEl.classList.add('content-revealing');
          if (current === 'mercury') playPanelReveal();
          else if (current === 'mars') playProgressReveal();
          else if (current === 'progress') powerOnCoach();
          else dropCardRects();
        }

        async function travel(targetPlanet) {
          if (busy) return;
          const next = targetPlanet || states[current].next;
          if (next === current || !states[next]) return;
          busy = true;
          targetX = 0;
          targetY = 0;

          const arrival = states[next].arrival;

          try {
            experienceEl.classList.add('is-loading');

            const usePortalImg = portalImage.getAttribute('src') === arrival.src;
            activeTransitionMedia = usePortalImg ? portalImage : transitionImage;
            if (!usePortalImg && transitionImage.getAttribute('src') !== arrival.src) {
              transitionImage.src = arrival.src;
            }
            if (!activeTransitionMedia.complete) {
              await new Promise(function(r) {
                activeTransitionMedia.onload = r;
                activeTransitionMedia.onerror = r;
                setTimeout(r, 800);
              });
            }
            experienceEl.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
            experienceEl.classList.add('is-transitioning');
            canvasOpacity = 1;
            transitionActive = true;
            await animateValue(function(v) { expansion = v; }, 1100);

            await new Promise(function(r) { setTimeout(r, 350); });

            hasFrozenScene = true;
            const d = Math.min(window.devicePixelRatio || 1, 2);
            sceneCanvas.width = window.innerWidth * d;
            sceneCanvas.height = window.innerHeight * d;
            sceneCtx.setTransform(d, 0, 0, d, 0, 0);
            sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            drawCover(sceneCtx, activeTransitionMedia);

            current = next;
            experienceEl.classList.add('is-committing');
            render();

            await new Promise(function(r) {
              requestAnimationFrame(function() {
                requestAnimationFrame(r);
              });
            });

            transitionActive = false;
            expansion = 0;
            maskScale = 0;
            canvasOpacity = 1;
            activeTransitionMedia = null;
            experienceEl.classList.remove('is-transitioning', 'is-committing');

            const maskReveal = revealMask();
            setTimeout(function() {
              revealPlanetContent();
            }, 100);
            await maskReveal;

            setTimeout(function() {
              busy = false;
              hasFrozenScene = false;
            }, 450);
          } catch (err) {
            console.error('Travel sequence error:', err);
            transitionActive = false;
            expansion = 0;
            maskScale = 1;
            canvasOpacity = 1;
            activeTransitionMedia = null;
            hasFrozenScene = false;
            experienceEl.classList.remove('is-loading', 'is-transitioning', 'is-committing');
            busy = false;
          }
        }

        portalBtn.addEventListener('click', function() { travel(); });

        planetListEl.addEventListener('click', function(e) {
          const btn = e.target.closest('.planet-item');
          if (!btn || busy) return;
          const p = btn.getAttribute('data-planet');
          if (!p || p === current) return;
          if (states[p]) travel(p);
        });

        // Lands the intro on Home with the same move every other arrival uses:
        // freeze the last Earth frame, open the portal at centre on the clay house,
        // expand it to full screen, then hand over to the real background.
        async function startExperience() {
          const arrival = states.mercury.arrival;
          busy = true;

          try {
            // 1. hold the Earth frame on canvas BEFORE the preloader fades
            if (preloaderVideo.videoWidth) {
              const d = Math.min(window.devicePixelRatio || 1, 2);
              sceneCanvas.width = window.innerWidth * d;
              sceneCanvas.height = window.innerHeight * d;
              sceneCtx.setTransform(d, 0, 0, d, 0, 0);
              sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
              drawCover(sceneCtx, preloaderVideo);
              hasFrozenScene = true;
            }

            // 2. the window shows the clay house for the current theme
            if (portalImage.getAttribute('src') !== arrival.src) portalImage.src = arrival.src;
            if (!portalImage.complete) {
              await new Promise(function(r) {
                portalImage.onload = r;
                portalImage.onerror = r;
                setTimeout(r, 1500);
              });
            }

            const w = Math.min(320, window.innerWidth * 0.31);
            const h = w * 350 / 320;
            introRect = {
              left: (window.innerWidth - w) / 2,
              top: (window.innerHeight - h) / 2,
              width: w,
              height: h
            };

            activeTransitionMedia = portalImage;
            transitionActive = true;
            canvasOpacity = 1;
            expansion = 0;
            targetX = 0;
            targetY = 0;

            // the canvas carries the picture now, so the video layer can go
            preloaderEl.classList.add('is-background');

            // 3. open at centre, then grow to full screen over the frozen Earth
            await revealMask();
            await animateValue(function(v) { expansion = v; }, 1100);

            // 4. full screen on the house: swap to the real background underneath
            transitionActive = false;
            expansion = 0;
            maskScale = 0;
            introRect = null;
            activeTransitionMedia = null;
            hasFrozenScene = false;
            render();

            await new Promise(function(r) {
              requestAnimationFrame(function() { requestAnimationFrame(r); });
            });

            // 5. normal chrome entrance; the top-left portal mask-reveals as usual
            document.body.classList.add('intro-ready');
            const maskReveal = revealMask();
            setTimeout(function() { revealPlanetContent(); }, 100);
            await maskReveal;
          } catch (err) {
            console.error('Intro landing error:', err);
            transitionActive = false;
            hasFrozenScene = false;
            introRect = null;
            activeTransitionMedia = null;
            expansion = 0;
            maskScale = 1;
            preloaderEl.classList.add('is-background');
            render();
            document.body.classList.add('intro-ready');
            revealPlanetContent();
          }

          busy = false;
        }

        function runPreloader() {
          let finishCalled = false;
          let bailout = setTimeout(function() {
            if (!finishCalled) finish();
          }, 9000);

          function finish() {
            if (finishCalled) return;
            finishCalled = true;
            preloaderValEl.textContent = '100';
            preloaderCountEl.classList.add('is-leaving');
            document.body.classList.add('preload-complete');
            startExperience();
            setTimeout(function() {
              preloaderCountEl.remove();
            }, 750);
          }

          function onProgress() {
            if (finishCalled) return;
            if (preloaderVideo.duration) {
              const pct = Math.min(99, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100));
              preloaderValEl.textContent = pct;
            }
            requestAnimationFrame(onProgress);
          }

          function startVideo() {
            if (preloaderVideo.duration) {
              preloaderVideo.playbackRate = Math.max(0.25, preloaderVideo.duration / 3);
            }
            preloaderVideo.play().then(function() {
              requestAnimationFrame(onProgress);
              // now that it is actually running, bail out against its real length
              clearTimeout(bailout);
              bailout = setTimeout(function() {
                if (!finishCalled) finish();
              }, ((preloaderVideo.duration || 5) / (preloaderVideo.playbackRate || 1)) * 1000 + 2000);
            }).catch(function() {
              finish();
            });
          }

          preloaderVideo.addEventListener('ended', finish, { once: true });
          preloaderVideo.addEventListener('error', finish, { once: true });

          if (preloaderVideo.readyState >= 1) {
            startVideo();
          } else {
            preloaderVideo.addEventListener('loadedmetadata', startVideo, { once: true });
          }

        }

        const themeToggle = document.getElementById('theme-toggle');

        function setTheme(next) {
          function commit() {
            document.documentElement.dataset.theme = next;
            themeToggle.setAttribute('aria-checked', next === 'dark' ? 'true' : 'false');
            try { localStorage.setItem('pj-theme', next); } catch (e) {}
            // the preview window holds a themed still, and .src is a getter
            syncPortalPreview();
            // the night monitor sits a little right of the day one, so the screen
            // rect travels between the two over the same 900ms as the crossfade
            animateValue(function (t) {
              screenMix = next === 'dark' ? t : 1 - t;
              layoutCoachScreen();
            }, 900);
          }

          const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!document.startViewTransition || reduced) {
            commit();
            return;
          }

          const r = themeToggle.getBoundingClientRect();
          const x = r.left + r.width / 2;
          const y = r.top + r.height / 2;
          const end = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));

          document.startViewTransition(commit).ready.then(function() {
            document.documentElement.animate({
              clipPath: [
                'circle(0px at ' + x + 'px ' + y + 'px)',
                'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'
              ]
            }, {
              duration: 620,
              easing: 'cubic-bezier(.22, 1, .36, 1)',
              pseudoElement: '::view-transition-new(root)'
            });
          }).catch(function() {});
        }

        themeToggle.setAttribute('aria-checked', document.documentElement.dataset.theme === 'dark' ? 'true' : 'false');
        themeToggle.addEventListener('click', function() {
          setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        });

        /* ---- HOME PANEL ---- */

        const homeData = {

          name: 'S YESHWANTH',
          session: {

          },
          focus: { label: 'Training focus', value: 'Balanced \u2014 general fitness', note: '4 days a week' },
          calories: { label: 'Calories today', value: 0, goal: 2363, unit: 'kcal' },

          checkin: {

        function playPanelReveal() {
          dropCardRects();
          panelEl.querySelectorAll('[data-count]').forEach(function (el) {
            const to = Number(el.getAttribute('data-count')) || 0;
            if (!to) { el.textContent = '0'; return; }
            animateValue(function (t) { el.textContent = Math.round(to * t).toLocaleString(); }, 1200);

        function setField(key, value) {
          value = Math.max(1, Math.min(checkin.max, value));
          if (checkinState[key] === value) return;

          const group = panelEl.querySelector('.segs[data-field="' + key + '"]');

          const cells = group.querySelectorAll('.seg');

          setField(dragField, Number(seg.getAttribute('data-value')));
          group.focus();
          e.preventDefault();

          const seg = e.target.closest('.seg');
          if (!seg) return;
          const group = seg.parentNode;

          if (dragField && group.getAttribute('data-field') === dragField) setField(dragField, value);
          else previewField(group, value);

        panelEl.addEventListener('pointerout', function (e) {

          if (!end) { slot.innerHTML = ''; return; }
          const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
          let chip = slot.querySelector('.rest-chip');
          if (!chip) {
            slot.innerHTML = '<button class="rest-chip" type="button" data-rest="' + ex + '" aria-live="polite"></button>';

          chip.textContent = 'Rest ' + left + 's';

              if (restEnds[k] <= Date.now()) { delete restEnds[k]; paintRest(Number(k)); }
